<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#2C2C2C" media="(prefers-color-scheme: dark)">
<meta name="description" content="产品设计、交互设计岗位的中英双语面试模拟：一面、二面、终面，500 题，语音朗读与框架笔记。">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="面试陪练">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.5 system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>设计面试陪练</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@700;800&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20,300,0..1,0&display=block">
<style>
/* Layout: Figma 编辑器风格——点阵画布上摆放带标签的 Frame；首页像图层/属性面板，练习页每题是一个 Frame，朗读时出现蓝色选中框 */
:root{
  --canvas:#F5F5F5; --dot:#D9D9D9; --panel:#FFFFFF; --hover:#F5F5F5; --field:#F5F5F5;
  --ink:#1E1E1E; --ink2:#5C5C5C; --muted:#8C8C8C; --line:#E6E6E6; --line2:#D9D9D9;
  --sel:#0D99FF; --sel-soft:#E5F4FF; --on-sel:#FFFFFF; --comp:#9747FF; --comp-soft:#F1E9FF; --ok:#14AE5C;
  --r1:var(--c-blue); --r2:var(--c-green); --r3:var(--c-purple);
  --shadow:0 0 .5px rgba(0,0,0,.18),0 3px 8px rgba(0,0,0,.1),0 1px 3px rgba(0,0,0,.1);
  --f:"Inter","Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --c-blue:#0D99FF; --c-blue-s:#E2F3FF; --c-green:#0AAE6E; --c-green-s:#DDF7EC; --c-purple:#9747FF; --c-purple-s:#F0E6FF;
  --c-coral:#F2552C; --c-coral-s:#FFE7E0; --c-yellow:#FFC943; --sticky:#FFF4F5; --sticky-ink:#2F2326; --tip-card:rgba(255,255,255,.78); --tip-chip:rgba(255,255,255,.85); --tip-line:rgba(176,86,108,.16); --tip-mute:#9A7880; --tip-acc:#C25A72; --tip-plus:#4E7D5E; --tip-minus:#B05A3C;
  --grad:linear-gradient(90deg,#0D99FF,#0ACF83 33%,#A259FF 66%,#FF7262);
  --fd:"Inter Tight","Inter","Noto Sans SC","PingFang SC",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --canvas:#1E1E1E; --dot:#383838; --panel:#2C2C2C; --hover:#383838; --field:#383838;
  --ink:#FFFFFF; --ink2:#C4C4C4; --muted:#9A9A9A; --line:#444444; --line2:#4F4F4F;
  --sel:#0C8CE9; --sel-soft:#183A55; --on-sel:#FFFFFF; --comp:#A469FF; --comp-soft:#3A2A55; --ok:#1BC47D;
  --r1:var(--c-blue); --r2:var(--c-green); --r3:var(--c-purple);
  --shadow:0 0 .5px rgba(0,0,0,.6),0 3px 8px rgba(0,0,0,.4); --c-blue:#3DADFF; --c-blue-s:#16324A; --c-green:#2BD196; --c-green-s:#14382A; --c-purple:#B07BFF; --c-purple-s:#33244F;
  --c-coral:#FF7A57; --c-coral-s:#4A231A; --c-yellow:#FFD466; --sticky:#2D2225; --sticky-ink:#F4E7EA; --tip-card:rgba(255,255,255,.04); --tip-chip:rgba(255,255,255,.06); --tip-line:rgba(244,190,204,.15); --tip-mute:#B5979E; --tip-acc:#EB8EA3; --tip-plus:#8CC39E; --tip-minus:#E39A7E; color-scheme:dark}}
:root[data-theme="dark"]{
  --canvas:#1E1E1E; --dot:#383838; --panel:#2C2C2C; --hover:#383838; --field:#383838;
  --ink:#FFFFFF; --ink2:#C4C4C4; --muted:#9A9A9A; --line:#444444; --line2:#4F4F4F;
  --sel:#0C8CE9; --sel-soft:#183A55; --on-sel:#FFFFFF; --comp:#A469FF; --comp-soft:#3A2A55; --ok:#1BC47D;
  --r1:var(--c-blue); --r2:var(--c-green); --r3:var(--c-purple);
  --shadow:0 0 .5px rgba(0,0,0,.6),0 3px 8px rgba(0,0,0,.4); --c-blue:#3DADFF; --c-blue-s:#16324A; --c-green:#2BD196; --c-green-s:#14382A; --c-purple:#B07BFF; --c-purple-s:#33244F;
  --c-coral:#FF7A57; --c-coral-s:#4A231A; --c-yellow:#FFD466; --sticky:#2D2225; --sticky-ink:#F4E7EA; --tip-card:rgba(255,255,255,.04); --tip-chip:rgba(255,255,255,.06); --tip-line:rgba(244,190,204,.15); --tip-mute:#B5979E; --tip-acc:#EB8EA3; --tip-plus:#8CC39E; --tip-minus:#E39A7E; color-scheme:dark}
html,body{height:100%}
body{background-color:var(--canvas);background-image:radial-gradient(var(--dot) 1px,transparent 1px);background-size:16px 16px;color:var(--ink);font-family:var(--f);font-size:13px;line-height:20px;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;font-feature-settings:"cv11","ss01"}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--sel);outline-offset:1px}
.ms{font-family:"Material Symbols Rounded";font-weight:normal;font-style:normal;font-size:20px;line-height:1;display:inline-block;white-space:nowrap;direction:ltr;font-feature-settings:"liga";-webkit-font-feature-settings:"liga";flex:none;width:1em;overflow:hidden;font-variation-settings:"FILL" 0,"wght" 300,"GRAD" 0,"opsz" 20;user-select:none}
.ms.sm{font-size:16px}
.ms.fill{font-variation-settings:"FILL" 1,"wght" 300,"GRAD" 0,"opsz" 20}
.st:hover{background:var(--hover)}

/* Frame 标签：画布上 frame 左上角的名字 */
.flabel{display:flex;align-items:center;gap:4px;font-size:11px;line-height:16px;color:var(--muted);padding:0 0 4px 1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.flabel .ms{font-size:14px}
.flabel.comp{color:var(--comp)}

/* ---------- 首页 ---------- */
#home{max-width:560px;margin:0 auto;padding-block:0 40px;padding-inline:16px;display:flex;flex-direction:column;gap:20px}
.appbar{display:flex;align-items:center;gap:8px;height:48px;margin:0 -16px;padding:calc(env(safe-area-inset-top,0px)) 16px 0;background:var(--panel);border-bottom:1px solid var(--line)}
.appbar .mark{width:28px;height:28px;border-radius:6px;background:var(--ink);color:var(--panel);display:grid;place-items:center}
.appbar .mark .ms{font-size:18px}
.appbar .crumb{flex:1;min-width:0;display:flex;align-items:center;gap:6px;font-size:13px;white-space:nowrap;overflow:hidden}
.appbar .crumb span{color:var(--muted)}
.appbar .crumb h1{font-size:13px;font-weight:600;margin:0}
.appbar .badge{font-size:11px;color:var(--muted);border:1px solid var(--line2);border-radius:4px;padding:0 6px;line-height:18px}
.framewrap{display:flex;flex-direction:column}
.hero{background:var(--panel);border:1px solid var(--line);border-radius:2px;padding:20px;display:flex;flex-direction:column;gap:12px;position:relative}
.hero h2{font-size:20px;line-height:28px;font-weight:700;margin:0;letter-spacing:-.01em}
.hero p{margin:0;color:var(--ink2);max-width:34em}
.hero .steps{display:flex;flex-wrap:wrap;gap:6px}
.hero .steps span{font-size:11px;line-height:20px;padding:0 8px;border-radius:4px;background:var(--field);color:var(--ink2)}
.fab{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px 0 8px;border:0;border-radius:5px;background:var(--sel);color:var(--on-sel);font-size:13px;font-weight:600}
.fab:hover{filter:brightness(.94)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);overflow:hidden}
.ptitle{display:flex;align-items:center;justify-content:space-between;height:40px;padding:0 12px 0 16px;font-size:11px;font-weight:600;border-bottom:1px solid var(--line)}
.ptitle span{font-weight:400;color:var(--muted)}
.mods{display:flex;flex-direction:column;padding:4px 0}
.mod{display:grid;grid-template-columns:32px 1fr auto;gap:8px;align-items:center;padding:6px 12px 6px 8px;border:0;background:none;text-align:left;width:100%;color:var(--ink);min-height:52px}
.mod .av{width:32px;height:32px;display:grid;place-items:center;color:var(--ink2)}
.mod b{display:block;font-size:13px;font-weight:600;line-height:18px}
.mod span.d{display:block;color:var(--muted);font-size:11px;line-height:16px}
.mod .cnt{display:flex;align-items:center;gap:2px;color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums;white-space:nowrap}
.settings{padding:4px 0}
.row{display:flex;align-items:center;gap:8px;padding:8px 12px 8px 16px;min-height:44px;box-sizing:border-box}
.row>.ms{color:var(--muted);font-size:18px}
.row label{flex:1;min-width:0;font-size:12px;line-height:16px}
.row small{display:block;color:var(--muted);font-size:11px;line-height:16px}
.row select{max-width:160px;background:var(--field);border:1px solid transparent;border-radius:5px;height:28px;padding:0 6px;font-size:12px}
.row select:hover{border-color:var(--line2)}
.row input[type=range]{width:110px;accent-color:var(--sel)}
.tbtn{display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 10px 0 6px;border-radius:5px;border:1px solid var(--line2);background:var(--panel);font-size:12px;font-weight:500}
/* Figma 小开关 */
.sw{position:relative;width:28px;height:16px;flex:none}
.sw input{position:absolute;inset:-8px;margin:0;opacity:0;cursor:pointer;z-index:1}
.sw i{position:absolute;inset:0;border-radius:8px;background:var(--line2);transition:background .15s}
.sw i::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform .15s}
.sw input:checked+i{background:var(--sel)}
.sw input:checked+i::after{transform:translateX(12px)}
.sw input:focus-visible+i{outline:2px solid var(--sel);outline-offset:2px}
.banner{display:flex;gap:10px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-left:3px solid #FFC700;border-radius:6px;padding:12px}
.banner .ms{color:#E5A000}
.banner b{display:block;font-size:12px;font-weight:600}
.banner p,.banner ol{margin:2px 0 0;font-size:12px;line-height:18px;color:var(--ink2)}
.banner ol{padding-left:16px}

/* ---------- 练习页 ---------- */
#play{position:fixed;inset:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:4px;padding:calc(env(safe-area-inset-top,0px)) 8px 0;height:48px;box-sizing:content-box;background:var(--panel);border-bottom:1px solid var(--line)}
.ib{width:32px;height:32px;border-radius:5px;display:grid;place-items:center;border:0;background:none;color:var(--ink2);flex:none;padding:0}
.top .ttl{flex:1;min-width:0;padding-left:4px;display:flex;align-items:baseline;gap:8px}
.top .ttl b{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .ttl span{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.prog{height:2px;background:var(--line)}
.prog i{display:block;height:100%;width:0;background:var(--sel);transition:width .3s}
.chips{display:flex;gap:2px;overflow-x:auto;padding:6px 8px;scrollbar-width:none;background:var(--panel);border-bottom:1px solid var(--line)}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;height:28px;padding:0 10px;border-radius:5px;border:0;background:none;color:var(--muted);font-size:12px;white-space:nowrap}
.chip .ms{display:none}
.chip:hover{color:var(--ink)}
.chip[aria-pressed=true]{background:var(--field);color:var(--ink);font-weight:600}
.feed{flex:1;overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior:contain}
.card{height:100%;scroll-snap-align:start;scroll-snap-stop:always;padding:20px 20px 72px;display:flex;flex-direction:column;box-sizing:border-box;max-width:660px;margin:0 auto}
.paper{flex:1;display:flex;flex-direction:column;gap:16px;background:var(--panel);border:1px solid var(--line);border-radius:2px;padding:20px;box-sizing:border-box;min-height:0;overflow-y:auto;position:relative;outline:1px solid transparent;outline-offset:-1px;transition:outline-color .15s}
/* 选中框 + 四角控制点 */
.paper .hd{position:absolute;width:7px;height:7px;background:#fff;border:1px solid var(--sel);opacity:0;transition:opacity .15s;pointer-events:none}
.paper .hd.a{top:-4px;left:-4px}.paper .hd.b{top:-4px;right:-4px}.paper .hd.c{bottom:-4px;left:-4px}.paper .hd.d{bottom:-4px;right:-4px}
.card.speaking .paper{outline-color:var(--sel);border-color:var(--sel)}
/* 题卡：外框不滚动（承载选中框和光标），内容区单独滚动，底部按钮固定 */
.paper.qp{overflow:visible;padding:0;gap:0}
.qp .pin{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:auto;padding:20px 20px 12px;display:flex;flex-direction:column;gap:16px;border-radius:inherit}
.qp .foot{flex:none;display:flex;flex-direction:column;gap:10px;padding:12px 20px 16px;border-top:1px solid var(--line);background:var(--panel)}
.qp .pin .tip{flex:none}
.card.speaking .paper .hd{opacity:1}
.card.speaking .flabel{color:var(--sel)}
.meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:11px}
.tag{display:inline-flex;align-items:center;gap:3px;height:20px;padding:0 6px 0 4px;border-radius:4px;background:color-mix(in srgb,var(--rc) 12%,transparent);color:var(--rc);font-weight:600}
.tag .ms{font-size:14px}
.cat{color:var(--ink2)}
.num{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums}
.who{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted)}
.who .ms{font-size:16px}
.card.speaking .who{color:var(--sel)}
.card.speaking .who .ms{animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
.q{font-size:clamp(20px,5.4vw,26px);line-height:1.5;font-weight:700;letter-spacing:-.01em;margin:0;text-wrap:pretty}
.spacer{flex:1}
/* 计时：仿 Frame 尺寸标签 */
.clock{display:flex;align-items:center;justify-content:center;gap:8px}
.clock .ms{display:none}
.clock .t{background:var(--sel);color:var(--on-sel);font-size:12px;font-weight:600;line-height:20px;padding:0 6px;border-radius:3px;font-variant-numeric:tabular-nums}
.clock .n{font-size:11px;color:var(--muted)}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.act{display:flex;align-items:center;justify-content:center;gap:4px;height:32px;border:1px solid var(--line2);border-radius:5px;background:var(--panel);color:var(--ink);font-size:12px;font-weight:500}
.act[aria-pressed=true]{background:var(--sel-soft);border-color:var(--sel);color:var(--sel)}
.act[aria-pressed=true].fav .ms{font-variation-settings:"FILL" 1,"wght" 300,"GRAD" 0,"opsz" 20}
.hint{display:flex;align-items:center;justify-content:center;gap:4px;font-size:11px;color:var(--muted);padding-top:8px}
/* 阶段卡：组件（紫色）样式 */
.stage .paper{justify-content:center;border-color:var(--comp);border-style:dashed}
.stage .eyebrow{display:inline-flex;align-items:center;gap:4px;align-self:flex-start;font-size:11px;font-weight:600;color:var(--comp);background:var(--comp-soft);border-radius:4px;padding:0 6px;line-height:20px}
.stage .eyebrow .ms{font-size:14px}
.stage h2{font-size:24px;line-height:32px;font-weight:700;margin:0}
.stage p{margin:0;color:var(--ink2);max-width:30em}
.facts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.facts li{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink2)}
.facts .ms{font-size:16px;color:var(--muted)}
.btns{display:flex;gap:6px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:4px;height:32px;padding:0 12px 0 8px;border-radius:5px;border:0;background:var(--sel);color:var(--on-sel);font-size:13px;font-weight:600}
.btn.outl{background:var(--panel);border:1px solid var(--line2);color:var(--ink);padding:0 12px}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;height:100%;color:var(--muted);padding:24px;text-align:center}
.empty .ms{font-size:32px}
.snack{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 76px);transform:translateX(-50%);background:#1E1E1E;color:#fff;padding:6px 12px;border-radius:6px;font-size:12px;z-index:9;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
/* 底部浮动工具栏（UI3） */
.bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;align-items:center;gap:2px;padding:4px;background:var(--panel);border-radius:12px;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.bar .sep{width:1px;height:20px;background:var(--line);margin:0 4px}
.nb{display:flex;align-items:center;gap:6px;height:36px;padding:0 10px;border:0;border-radius:8px;background:none;color:var(--ink);font-size:12px;font-weight:500;white-space:nowrap}
.nb .pillic{display:grid;place-items:center}
.nb:hover{background:var(--hover)}
.nb[aria-pressed=true]{background:var(--sel);color:var(--on-sel)}

/* ---------- 彩色元素 ---------- */
.ms.fill{font-variation-settings:"FILL" 1,"wght" 400,"GRAD" 0,"opsz" 20}
.appbar .mark{background:none;width:28px;height:28px;display:grid;grid-template-columns:1fr 1fr;gap:2px;padding:3px;box-sizing:border-box}
.appbar .mark i{border-radius:50%}
.appbar .mark i:nth-child(1){background:var(--c-coral)}.appbar .mark i:nth-child(2){background:var(--c-purple)}
.appbar .mark i:nth-child(3){background:var(--c-blue)}.appbar .mark i:nth-child(4){background:var(--c-green)}
.hero{overflow:visible;padding:24px 20px 20px}
.hero h2{font-family:var(--fd);font-size:26px;line-height:34px;font-weight:800;letter-spacing:-.02em}
.hero h2 mark{background:none;color:inherit;position:relative;white-space:nowrap}
.hero h2 mark::after{content:"";position:absolute;left:-2px;right:-2px;bottom:2px;height:10px;background:var(--c-yellow);opacity:.55;z-index:-1;border-radius:2px}
.hero h2{position:relative;z-index:0}
.hero .steps span{display:inline-flex;align-items:center;gap:5px;font-weight:600}
.hero .steps span i{width:8px;height:8px;border-radius:50%;flex:none}
.hero .steps .s1{background:var(--c-blue-s);color:var(--c-blue)}.hero .steps .s1 i{background:var(--c-blue)}
.hero .steps .s2{background:var(--c-green-s);color:var(--c-green)}.hero .steps .s2 i{background:var(--c-green)}
.hero .steps .s3{background:var(--c-purple-s);color:var(--c-purple)}.hero .steps .s3 i{background:var(--c-purple)}
/* 多人协作光标 */
.cursor{position:absolute;display:flex;flex-direction:column;align-items:flex-start;pointer-events:none;z-index:2;animation:float 4s ease-in-out infinite}
.cursor svg{width:16px;height:16px;fill:var(--cc);stroke:#fff;stroke-width:1.5;filter:drop-shadow(0 1px 1px rgba(0,0,0,.2))}
.cursor span{margin:-2px 0 0 12px;background:var(--cc);color:#fff;font-size:11px;font-weight:600;line-height:18px;padding:0 6px;border-radius:2px 8px 8px 8px;white-space:nowrap}
.hero .cursor.k1{--cc:var(--c-coral);right:18px;top:-14px}
.hero .cursor.k2{--cc:var(--c-purple);right:92px;bottom:18px;animation-delay:-2s}
@keyframes float{50%{transform:translate(3px,-4px)}}
/* 彩色图标块 */
.mod .av{border-radius:8px;background:var(--ts);color:var(--tc)}
.mod .av .ms{font-variation-settings:"FILL" 1,"wght" 400,"GRAD" 0,"opsz" 20}
.row>.ms{color:var(--ic,var(--muted))}
/* 参考思路：见下方结构化便利贴 */
/* 流程：竖向步骤线 */
.flow{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.flow li{display:grid;grid-template-columns:22px 1fr;gap:10px;position:relative;padding-bottom:10px;font-size:13px;line-height:20px;color:var(--ink)}
.flow li:last-child{padding-bottom:0}
.flow li::before{content:"";position:absolute;left:10.5px;top:22px;bottom:0;width:1px;background:color-mix(in srgb,var(--rc) 35%,var(--line))}
.flow li:last-child::before{display:none}
.flow .n{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--rc);background:color-mix(in srgb,var(--rc) 12%,var(--panel));border:1px solid color-mix(in srgb,var(--rc) 40%,transparent);font-variant-numeric:tabular-nums}
.flow li:last-child .n{background:var(--rc);color:#fff;border-color:var(--rc)}
/* 要点：编号方块 */
.pts{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px}
.pts span{display:flex;align-items:flex-start;gap:6px;padding:7px 8px;border-radius:6px;background:var(--field);font-size:12px;line-height:17px;color:var(--ink)}
.pts span i{flex:none;font-style:normal;font-size:10px;font-weight:700;color:var(--rc);line-height:17px;font-variant-numeric:tabular-nums}
/* STAR 四格 */
.star{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.star div{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border-radius:6px;background:var(--field);text-align:center}
.star b{font-family:var(--fd);font-size:20px;line-height:24px;font-weight:800;color:var(--rc)}
.star span{font-size:11px;color:var(--ink2);line-height:15px}
.star .hot{background:color-mix(in srgb,var(--rc) 14%,var(--panel));outline:1px solid var(--rc)}
.star .hot span::after{content:" · 重点";color:var(--rc);font-weight:600}
/* 核心观点 */
.core{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:21px;color:var(--ink)}
.core::before{content:"";flex:none;width:3px;align-self:stretch;border-radius:2px;background:var(--rc)}
.note2{margin:8px 0 0;font-size:12px;line-height:18px;color:var(--muted)}
/* 题卡上的面试官光标 */
.paper .cursor{--cc:var(--rc);right:18px;top:-12px;opacity:0;transition:opacity .2s}
.card.speaking .paper .cursor{opacity:1}
.tag{background:var(--rc);color:#fff}
.who .ms{color:var(--rc)}
.q{font-family:var(--fd);font-weight:800;letter-spacing:-.015em}
.flabel .ms{color:var(--rc,var(--muted))}
.stage .paper{border-color:var(--rc)}
.stage .eyebrow{background:var(--rc);color:#fff}
.stage h2{font-family:var(--fd);font-weight:800;font-size:28px;line-height:36px}
.facts .ms{color:var(--rc)}
.prog i{background:var(--grad);background-size:100vw 100%}
.nb[aria-pressed=true]{background:var(--rc,var(--sel))}
.bar .dots{display:flex;gap:3px;padding:0 6px 0 8px}
.bar .dots i{width:6px;height:6px;border-radius:50%}
.bar .dots i:nth-child(1){background:var(--c-coral)}.bar .dots i:nth-child(2){background:var(--c-purple)}.bar .dots i:nth-child(3){background:var(--c-blue)}.bar .dots i:nth-child(4){background:var(--c-green)}
.act[aria-pressed=true]{background:color-mix(in srgb,var(--rc) 12%,var(--panel));border-color:var(--rc);color:var(--rc)}
.clock .t{background:var(--rc)}
.chip[aria-pressed=true]{background:color-mix(in srgb,var(--rc) 14%,var(--panel));color:var(--rc)}
.fab{background:var(--ink);color:var(--panel)}
.tip{background:var(--sticky);color:var(--sticky-ink);border-radius:4px;box-shadow:0 1px 2px rgba(0,0,0,.08),0 6px 14px -6px rgba(0,0,0,.18);flex:none}
/* ---------- 结构化答题思路 ---------- */
.tip{transform:none;padding:14px;display:flex;flex-direction:column;gap:12px;font-size:12px;line-height:18px}
.tip-h{display:flex;align-items:center;justify-content:space-between}
.tip-h b .ms{color:var(--c-coral)}
.tip-h b{display:flex;align-items:center;gap:4px;font-size:13px;font-weight:700;margin:0}
.tip .time{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:600;background:var(--tip-chip);border-radius:999px;padding:0 8px;line-height:20px}
.look{display:flex;flex-direction:column;gap:2px;font-size:13px;line-height:19px}
.look span,.t-sec,.key span,.pa span{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:700;letter-spacing:.02em;opacity:.75}
.t-sec{margin-bottom:-6px}
/* 步骤流 */
.v-flow{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;position:relative}
.v-flow li{display:flex;gap:10px;align-items:flex-start;position:relative;padding-bottom:10px}
.v-flow li:last-child{padding-bottom:0}
.v-flow li:not(:last-child)::before{content:"";position:absolute;left:13px;top:28px;bottom:0;width:2px;background:var(--k);opacity:.35;border-radius:1px}
.v-flow .dot{width:28px;height:28px;border-radius:8px;background:var(--k);color:#fff;display:grid;place-items:center;flex:none}
.v-flow .dot .ms{font-size:16px}
.v-flow b{display:block;font-size:13px;line-height:18px;font-weight:700;color:var(--sticky-ink)}
.v-flow small{display:block;font-size:12px;line-height:17px;opacity:.85}
/* 漏斗 */
.v-funnel{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;align-items:center}
.v-funnel li{width:var(--w);display:flex;flex-direction:column;align-items:center;gap:1px;text-align:center}
.v-funnel .bar{width:100%;box-sizing:border-box;display:flex;align-items:center;justify-content:center;gap:4px;background:var(--k);color:#fff;font-weight:700;font-size:12px;line-height:26px;border-radius:6px}
.v-funnel small{font-size:11px;line-height:15px;opacity:.85}
/* STAR 四格 */
.v-star{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.v-star div{background:var(--tip-card);border-radius:8px;padding:8px 10px;border-top:3px solid var(--k);min-width:0}
.v-star em{font-style:normal;font-family:var(--fd);font-weight:800;font-size:18px;line-height:22px;color:var(--k);margin-right:4px}
.v-star b{font-size:13px;font-weight:700}
.v-star small{display:block;font-size:11px;line-height:16px;opacity:.85;margin-top:2px}
/* 状态格 */
.v-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:6px}
.v-grid div{display:grid;grid-template-columns:22px 1fr;column-gap:6px;align-items:center;background:var(--tip-card);border-radius:8px;padding:7px 8px;min-width:0}
.v-grid .ms{grid-row:span 2;color:var(--k);font-size:20px}
.v-grid b{font-size:12px;line-height:16px;font-weight:700}
.v-grid small{font-size:11px;line-height:14px;opacity:.8}
/* 对比 */
.v-vs{display:flex;flex-direction:column;gap:4px}
.v-vs .vh{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center;margin-bottom:2px}
.v-vs .vh span{background:var(--k);color:#fff;font-weight:700;font-size:12px;line-height:16px;text-align:center;border-radius:6px;padding:5px 6px;min-width:0;overflow-wrap:anywhere}
.v-vs .vh i{font-style:normal;font-family:var(--fd);font-weight:800;font-size:12px;opacity:.6}
.v-vs .vr{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.v-vs .vr span{background:var(--tip-card);border-radius:6px;padding:5px 8px;font-size:12px;text-align:center}
.v-vs .vr.one{display:block;background:var(--tip-card);border-radius:6px;padding:5px 8px;font-size:12px;text-align:center;position:relative}
.v-vs .vr.one::before,.v-vs .vr.one::after{content:"←";position:absolute;left:10px;opacity:.4}
.v-vs .vr.one::after{content:"→";left:auto;right:10px}
/* 本题要点 */
.key{display:flex;gap:8px;align-items:flex-start;background:var(--tip-card);border-radius:8px;padding:8px 10px;font-size:13px;line-height:19px}
.key>.ms{color:var(--c-coral);margin-top:1px}
.key span{display:block}
/* 加分 / 避坑 */
.pa{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pa>div{border-radius:8px;padding:8px 10px;min-width:0}
.pa .p{background:color-mix(in srgb,var(--c-green) 13%,var(--tip-card))}
.pa .a{background:color-mix(in srgb,var(--c-coral) 12%,var(--tip-card))}
.pa .p span .ms{color:var(--c-green)}.pa .a span .ms{color:var(--c-coral)}
.pa ul{margin:4px 0 0;padding-left:14px;font-size:12px;line-height:17px}
.pa li+li{margin-top:2px}
@media (max-width:360px){.pa,.v-star{grid-template-columns:1fr}}
.key .flow li,.key .pts span,.key .core{color:var(--sticky-ink)}
.key .pts span{background:var(--tip-chip)}
.key .note2{color:inherit;opacity:.75}
.key .lead{font-size:12px;font-weight:700;margin:0 0 6px}
.key>div{flex:1;min-width:0}
.key>div>span{margin-bottom:4px}

/* ---------- 思路卡：精致版（单色线性图标 + 暖灰发丝线） ---------- */
.tip{background:var(--sticky);color:var(--sticky-ink);border:1px solid var(--tip-line);border-radius:10px;box-shadow:none;padding:16px;gap:14px}
.tip .ms{font-variation-settings:"FILL" 0,"wght" 300,"GRAD" 0,"opsz" 20}
.tip-h b{font-size:13px;font-weight:600;letter-spacing:.01em}
.tip-h b .ms{color:var(--tip-acc);font-size:18px}
.tip .time{background:none;border:1px solid var(--tip-line);color:var(--tip-mute);font-weight:500}
.look span,.t-sec,.key span,.pa span{color:var(--tip-mute);opacity:1;font-weight:600;font-size:10.5px;letter-spacing:.08em}
.look{font-size:13px;line-height:20px;padding-bottom:12px;border-bottom:1px solid var(--tip-line)}
.t-sec{margin-bottom:-4px}
.no{font-style:normal;font-family:var(--fd);font-weight:700;font-size:11px;color:var(--tip-acc);margin-right:6px;font-variant-numeric:tabular-nums;letter-spacing:.02em}
/* 步骤流 */
.v-flow li{gap:12px;padding-bottom:12px}
.v-flow li:not(:last-child)::before{left:13.5px;top:30px;width:0;background:none;border-left:1px dashed var(--tip-line);opacity:1}
.v-flow .dot{width:28px;height:28px;border-radius:50%;background:var(--tip-card);border:1px solid var(--tip-line);color:var(--sticky-ink)}
.v-flow .dot .ms{font-size:16px;opacity:.75}
.v-flow li:first-child .dot{border-color:var(--tip-acc);color:var(--tip-acc)}
.v-flow li:first-child .dot .ms{opacity:1}
.v-flow b{font-weight:600;display:flex;align-items:baseline}
.v-flow small{opacity:1;color:var(--tip-mute);margin-top:1px}
/* 漏斗：同一暖色的明度阶梯 */
.v-funnel{gap:4px}
.v-funnel .bar{background:color-mix(in srgb,var(--tip-acc) calc(26% - var(--i,0) * 4%),transparent);color:var(--sticky-ink);font-weight:600;border:1px solid var(--tip-line);line-height:28px}
.v-funnel small{opacity:1;color:var(--tip-mute)}
/* STAR */
.v-star div{background:var(--tip-card);border:1px solid var(--tip-line);border-top:1px solid var(--tip-line);border-radius:8px}
.v-star em{color:var(--tip-acc);font-size:16px}
.v-star b{font-weight:600}
.v-star small{opacity:1;color:var(--tip-mute)}
.v-star div:nth-child(3){border-color:var(--tip-acc)}
/* 状态格 */
.v-grid div{background:var(--tip-card);border:1px solid var(--tip-line)}
.v-grid .ms{color:var(--sticky-ink);opacity:.7;font-size:18px}
.v-grid b{font-weight:600}
.v-grid small{opacity:1;color:var(--tip-mute)}
/* 对比 */
.v-vs .vh span{background:var(--tip-card);color:var(--sticky-ink);border:1px solid var(--tip-line);font-weight:600}
.v-vs .vh span:first-child{border-color:var(--tip-acc)}
.v-vs .vh i{font-family:Georgia,"Times New Roman",serif;font-style:italic;font-weight:400;font-size:14px;color:var(--tip-mute);opacity:1}
.v-vs .vr span,.v-vs .vr.one{background:none;border-bottom:1px dashed var(--tip-line);border-radius:0;color:var(--sticky-ink)}
.v-vs .vr.one::before,.v-vs .vr.one::after{color:var(--tip-mute)}
/* 本题要点 */
.key{background:none;border-left:2px solid var(--tip-acc);border-radius:0;padding:2px 0 2px 12px}
.key>.ms{display:none}
.key .pts span{background:var(--tip-card);border:1px solid var(--tip-line)}
.key .pts span i{color:var(--tip-acc)}
.key .flow .n{background:var(--tip-card);color:var(--tip-acc);border-color:var(--tip-line)}
.key .flow li:last-child .n{background:var(--tip-acc);color:#fff;border-color:var(--tip-acc)}
.key .flow li::before{background:var(--tip-line)}
.key .core::before{display:none}
.key .core{padding:0}
/* 加分 / 避坑 */
.pa{gap:8px;padding-top:12px;border-top:1px solid var(--tip-line)}
.pa>div,.pa .p,.pa .a{background:none;padding:0;border-radius:0}
.pa .gl{font-style:normal;font-family:var(--fd);font-weight:700;font-size:13px;width:16px;height:16px;border-radius:50%;display:inline-grid;place-items:center;margin-right:4px;line-height:1}
.pa .p .gl{color:var(--tip-plus);border:1px solid var(--tip-plus)}
.pa .a .gl{color:var(--tip-minus);border:1px solid var(--tip-minus)}
.pa ul{list-style:none;padding-left:0;margin-top:6px}
.pa li{position:relative;padding-left:12px;color:var(--sticky-ink)}
.pa li::before{content:"";position:absolute;left:2px;top:7px;width:4px;height:4px;border-radius:50%;background:var(--tip-mute);opacity:.6}

/* 思路卡：Figma 浅色便利贴色系，每类题一种颜色 */
.tip.tc0{--sticky:#FFF0FA;--tip-acc:#C9479F}
.tip.tc1{--sticky:#EAF5FF;--tip-acc:#1A8FE0}
.tip.tc2{--sticky:#EDFAF2;--tip-acc:#2A9A58}
.tip.tc3{--sticky:#F5EEFF;--tip-acc:#8A5CF0}
.tip.tc4{--sticky:#FFF5E8;--tip-acc:#CF7A1C}
.tip.tc5{--sticky:#EAF9F7;--tip-acc:#1C978B}
.tip.tc6{--sticky:#FFF1EE;--tip-acc:#D2554B}
.tip.tc7{--sticky:#FFFAE3;--tip-acc:#AE8400}
.tip[class*="tc"]{--sticky-ink:#26232A;--tip-line:color-mix(in srgb,var(--tip-acc) 22%,transparent);--tip-mute:color-mix(in srgb,var(--tip-acc) 55%,#6E6E6E);--tip-card:rgba(255,255,255,.78)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tip[class*="tc"]{--sticky:color-mix(in srgb,var(--tip-acc) 14%,#232323);--sticky-ink:#F1F1F1;--tip-mute:color-mix(in srgb,var(--tip-acc) 50%,#B5B5B5);--tip-card:rgba(255,255,255,.05)}}
:root[data-theme="dark"] .tip[class*="tc"]{--sticky:color-mix(in srgb,var(--tip-acc) 14%,#232323);--sticky-ink:#F1F1F1;--tip-mute:color-mix(in srgb,var(--tip-acc) 50%,#B5B5B5);--tip-card:rgba(255,255,255,.05)}
/* ---------- 笔记面板与笔记预览 ---------- */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.28);z-index:20}
.sheet{position:fixed;left:50%;transform:translateX(-50%);bottom:0;z-index:21;width:min(640px,100%);max-height:86%;box-sizing:border-box;display:flex;flex-direction:column;gap:12px;border-radius:14px 14px 0 0;border-bottom:0;padding:16px 16px calc(env(safe-area-inset-bottom,0px) + 14px);box-shadow:0 -8px 30px rgba(0,0,0,.18)}
.sheet .sh-h{display:flex;align-items:center;gap:8px}
.sheet .sh-h b{flex:1;display:flex;align-items:center;gap:6px;font-size:14px;font-weight:700}
.sheet .sh-h b .ms{color:var(--tip-acc)}
.sheet .sh-h .ib{width:28px;height:28px;color:var(--tip-mute)}
.sheet .sh-q{margin:0;font-family:var(--fd);font-weight:700;font-size:15px;line-height:22px}
.sheet .sh-s{margin:-6px 0 0;font-size:11px;color:var(--tip-mute)}
.sh-f{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding-right:2px}
.fld{display:flex;flex-direction:column;gap:4px}
.fld span{display:flex;align-items:baseline;font-size:12px;font-weight:600}
.fld textarea{resize:vertical;min-height:44px;font:inherit;font-size:13px;line-height:19px;color:var(--sticky-ink);background:var(--tip-card);border:1px solid var(--tip-line);border-radius:6px;padding:8px 10px;box-sizing:border-box;width:100%}
.fld textarea::placeholder{color:var(--tip-mute);opacity:.8}
.fld textarea:focus{outline:none;border-color:var(--tip-acc);box-shadow:0 0 0 2px color-mix(in srgb,var(--tip-acc) 18%,transparent)}
.sh-foot{display:flex;align-items:center;gap:8px;padding-top:4px;border-top:1px solid var(--tip-line)}
.sh-foot .grow{flex:1}
.linkbtn{border:0;background:none;color:var(--tip-minus,#B05A3C);font-size:12px;font-weight:600;padding:8px 4px}
.sheet .btn{background:var(--ink);color:var(--panel)}
.mynote{border:1px dashed var(--line2);border-radius:8px;padding:10px 12px;font-size:12px;line-height:18px;flex:none}
.mn-h{display:flex;align-items:center;gap:4px;font-size:11px;font-weight:700;color:var(--muted);margin-bottom:6px}
.mn-e{margin-left:auto;border:0;background:none;color:var(--sel);font-size:11px;font-weight:600;padding:0}
.mynote dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 10px}
.mynote dt{color:var(--muted);white-space:nowrap}
.mynote dd{margin:0;color:var(--ink);white-space:pre-wrap;min-width:0;overflow-wrap:anywhere}
.act.fav[aria-pressed=true]{background:color-mix(in srgb,var(--c-coral) 10%,var(--panel));border-color:var(--c-coral);color:var(--c-coral)}

/* 语言切换 */
.lang{display:inline-flex;background:var(--field);border-radius:6px;padding:2px;margin-left:6px;flex:none}
.lang button{border:0;background:none;border-radius:4px;height:24px;min-width:30px;padding:0 6px;font-size:11px;font-weight:600;color:var(--muted)}
.lang button[aria-pressed=true]{background:var(--panel);color:var(--ink);box-shadow:0 0 0 .5px rgba(0,0,0,.12),0 1px 2px rgba(0,0,0,.08)}
.langb{height:28px;min-width:34px;border:1px solid var(--line2);border-radius:5px;background:var(--panel);font-size:11px;font-weight:700;color:var(--ink2);padding:0 6px;flex:none}
html[lang=en] .q{letter-spacing:-.01em}
html[lang=en] .hint,html[lang=en] .flabel{letter-spacing:0}

/* PWA */
.inst{display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 10px 0 6px;border:0;border-radius:5px;background:var(--sel);color:#fff;font-size:12px;font-weight:600;margin-left:6px;flex:none}
.inst .ms{font-size:16px}
.iosTip{display:flex;gap:10px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--sel);border-radius:6px;padding:12px}
.iosTip>.ms{color:var(--sel)}
.iosTip div{flex:1}
.iosTip b{display:block;font-size:12px;font-weight:600}
.iosTip p{margin:2px 0 0;font-size:12px;line-height:18px;color:var(--ink2)}
.iosTip .ib{width:24px;height:24px}
.offline{position:fixed;top:calc(env(safe-area-inset-top,0px) + 6px);left:50%;transform:translateX(-50%);z-index:30;background:var(--ink);color:var(--panel);font-size:11px;padding:2px 10px;border-radius:999px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<main id="home">
  <header class="appbar">
    <div class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <div class="crumb"><span data-en="Interview prep /">面试准备 /</span><h1 data-en="Design Interview Coach">设计面试陪练</h1></div>
    <span class="badge" data-en="500 Qs">500 题</span>
    <div class="lang" role="group" aria-label="语言 / Language"><button id="lzh" data-l="zh" aria-pressed="true">中</button><button id="len" data-l="en" aria-pressed="false">EN</button></div><button class="inst" id="installBtn" hidden><span class="ms">install_mobile</span><span data-en="Install">安装</span></button>
  </header>

  <section class="framewrap">
    <div class="flabel"><span class="ms">tag</span><span data-en="Full interview">完整面试</span></div>
    <div class="hero">
    <div class="cursor k1" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="M2 1.5l11 5.2-4.6 1.4L6.6 13z"/></svg><span data-en="Design Director">设计总监</span></div>
    <div class="cursor k2" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="M2 1.5l11 5.2-4.6 1.4L6.6 13z"/></svg><span data-en="You">你</span></div>

      <div class="row"><span class="ms fill" style="--ic:var(--c-purple)">shuffle</span><label for="sShuf"><span data-en="Shuffle">随机出题</span><small data-en="Randomize order when practicing by round">分轮练习时打乱顺序</small></label><span class="sw"><input type="checkbox" id="sShuf" checked><i></i></span></div>

<script>
const QS = [{"r": 1, "c": "自我介绍与作品集", "q": "请用 2 分钟做一个自我介绍。", "t": "背景→核心能力→代表项目→为什么是这个岗位，控制在 2 分钟，结尾留一个可被追问的钩子。", "qe": "Give me a two-minute self-introduction.", "te": "Background → core strengths → signature project → why this role. Keep it to two minutes and end with a hook the interviewer can follow up on."}, {"r": 1, "c": "自我介绍与作品集", "q": "挑一个你最有代表性的项目，用 5 分钟讲给我听。", "t": "STAR：背景与目标、你的角色、关键决策、量化结果，留出取舍过程。", "qe": "Pick your most representative project and walk me through it in five minutes.", "te": "STAR: context and goals, your role, key decisions, measurable results. Leave room to explain trade-offs."}, {"r": 1, "c": "自我介绍与作品集", "q": "你的作品集为什么选了这几个项目？", "t": "说明筛选逻辑：覆盖的能力维度、与岗位的匹配度、项目难度梯度。", "qe": "Why did you choose these projects for your portfolio?", "te": "Explain your selection logic: the skills each one covers, fit with this role, and a range of difficulty."}, {"r": 1, "c": "自我介绍与作品集", "q": "这个项目里你具体负责了哪些部分？", "t": "清楚划分个人贡献与团队贡献，用“我”描述决策，不夸大。", "qe": "Which parts of this project were you personally responsible for?", "te": "Separate your contribution from the team's. Describe decisions with “I”, and don't overstate."}, {"r": 1, "c": "自我介绍与作品集", "q": "这个项目最终上线了吗？上线后的效果如何？", "t": "给出数据或用户反馈；未上线就说明原因和你从中学到什么。", "qe": "Did this project ship? How did it perform after launch?", "te": "Share data or user feedback. If it didn't ship, explain why and what you learned."}, {"r": 1, "c": "自我介绍与作品集", "q": "如果让你重做这个项目，你会改哪里？", "t": "体现复盘能力：指出一个真实缺陷、原因、改进方案。", "qe": "If you could redo this project, what would you change?", "te": "Show reflection: name one real flaw, why it happened, and how you'd fix it."}, {"r": 1, "c": "自我介绍与作品集", "q": "作品集中哪个设计决策是你最骄傲的？", "t": "讲清问题、备选方案、选择依据和验证结果。", "qe": "Which design decision in your portfolio are you proudest of?", "te": "Cover the problem, the alternatives, why you chose this one, and how you validated it."}, {"r": 1, "c": "自我介绍与作品集", "q": "你过去的项目中，设计稿和最终上线效果差距大吗？怎么处理的？", "t": "谈设计走查、与开发的协作机制、优先级取舍。", "qe": "Was there a big gap between your designs and what actually shipped? How did you handle it?", "te": "Talk about design QA, how you work with engineers, and how you prioritized."}, {"r": 1, "c": "自我介绍与作品集", "q": "你在上一份工作中最大的成长是什么？", "t": "具体到一种能力，用事例佐证。", "qe": "What was your biggest area of growth in your last role?", "te": "Name one specific skill and back it up with an example."}, {"r": 1, "c": "自我介绍与作品集", "q": "你为什么想做产品/交互设计？", "t": "真实动机 + 与过往经历的连接，避免空泛的“热爱”。", "qe": "Why do you want to work in product or interaction design?", "te": "Real motivation plus a link to your past experience. Avoid a vague “I just love design”."}, {"r": 1, "c": "自我介绍与作品集", "q": "你的设计风格或设计理念是什么？", "t": "一句可落地的理念 + 项目中的体现，避免玄学化。", "qe": "What is your design style or philosophy?", "te": "One actionable principle and how it shows up in your projects. Avoid sounding mystical."}, {"r": 1, "c": "自我介绍与作品集", "q": "你做过的项目里，哪个用户群体最难理解？为什么？", "t": "说出认知差异、你采用的研究方法、如何建立同理心。", "qe": "Which user group was hardest for you to understand, and why?", "te": "Describe the gap in mental models, the research methods you used, and how you built empathy."}, {"r": 1, "c": "自我介绍与作品集", "q": "你目前的职级和主要职责是什么？", "t": "如实描述职责范围、汇报关系、负责业务规模。", "qe": "What is your current level and what are your main responsibilities?", "te": "Be accurate about scope, reporting line, and the size of the business you support."}, {"r": 1, "c": "自我介绍与作品集", "q": "你的作品集里有没有失败的项目？", "t": "敢于谈失败：原因、你的反思、后续做法的改变。", "qe": "Is there a project in your portfolio that failed?", "te": "Own the failure: the causes, your reflection, and how you work differently now."}, {"r": 1, "c": "自我介绍与作品集", "q": "用三个词形容你自己作为设计师的特点。", "t": "每个词配一个具体事例，与岗位需求呼应。", "qe": "Describe yourself as a designer in three words.", "te": "Back each word with a concrete example that connects to the role."}, {"r": 1, "c": "自我介绍与作品集", "q": "最近半年你最满意的一个设计细节是什么？", "t": "小而具体的交互细节，讲清它解决了什么问题。", "qe": "What design detail from the last six months are you most satisfied with?", "te": "Pick a small, specific interaction detail and explain the problem it solved."}, {"r": 1, "c": "自我介绍与作品集", "q": "你的项目里有多少是从 0 到 1，多少是迭代优化？", "t": "区分两类项目的不同方法与挑战。", "qe": "How many of your projects were zero-to-one versus iterative improvements?", "te": "Contrast the different methods and challenges of each type."}, {"r": 1, "c": "自我介绍与作品集", "q": "你在作品集中提到“提升了转化率”，这个数据是怎么得出的？", "t": "说明实验方式、对照组、归因是否严谨，体现数据诚实。", "qe": "Your portfolio says you “increased conversion”. How was that number measured?", "te": "Explain the experiment setup, control group, and whether attribution is sound. Show data honesty."}, {"r": 1, "c": "交互基础", "q": "你怎么理解交互设计？它和 UI 设计、产品设计的边界在哪里？", "t": "交互关注行为与流程，UI 关注视觉表达，产品关注价值与目标；实际工作中边界模糊，重点讲协作。", "qe": "How do you define interaction design? Where are its boundaries with UI and product design?", "te": "Interaction covers behavior and flow, UI covers visual expression, product covers value and goals; in practice the lines blur, so focus on collaboration."}, {"r": 1, "c": "交互基础", "q": "什么是好的交互设计？你的评判标准是什么？", "t": "可用性（有效、效率、满意）+ 业务目标达成 + 可实现性，配一个例子。", "qe": "What makes interaction design good? What criteria do you use?", "te": "Usability (effectiveness, efficiency, satisfaction) + business goals + feasibility, with one example."}, {"r": 1, "c": "交互基础", "q": "谈谈你对“用户体验”的理解。", "t": "可用 Garrett 五层模型或 Peter Morville 蜂窝模型，并联系实际。", "qe": "What does “user experience” mean to you?", "te": "Use Garrett's five planes or Morville's honeycomb, and tie it to real work."}, {"r": 1, "c": "交互基础", "q": "说说尼尔森十大可用性原则，并选两条举例。", "t": "系统状态可见、匹配现实、用户控制、一致性、防错、识别而非回忆、灵活高效、简约、帮助纠错、帮助文档。", "qe": "Walk me through Nielsen's ten usability heuristics and give examples for two of them.", "te": "Visibility of status, match with the real world, user control, consistency, error prevention, recognition over recall, flexibility, minimalism, error recovery, help and docs."}, {"r": 1, "c": "交互基础", "q": "什么是信息架构？你一般如何搭建？", "t": "内容盘点→卡片分类→树状测试→导航设计，强调组织、标签、导航、搜索系统。", "qe": "What is information architecture, and how do you build one?", "te": "Content inventory → card sorting → tree testing → navigation design. Cover organization, labeling, navigation and search."}, {"r": 1, "c": "交互基础", "q": "模态弹窗和非模态提示各适合什么场景？", "t": "按打断程度和信息重要性区分：确认/危险操作用模态，结果反馈用 Toast/Snackbar。", "qe": "When should you use a modal dialog versus a non-modal message?", "te": "Decide by how disruptive it is and how important the message is: modals for confirmations and destructive actions, toasts or snackbars for feedback."}, {"r": 1, "c": "交互基础", "q": "如何设计一个让用户不迷路的导航结构？", "t": "清晰的层级、当前位置指示、返回路径、深度与广度平衡。", "qe": "How do you design navigation so users never get lost?", "te": "Clear hierarchy, a current-location indicator, a way back, and a balance of depth and breadth."}, {"r": 1, "c": "交互基础", "q": "你怎么看待“三次点击原则”？", "t": "点击次数不是关键，关键是每一步是否确定、无认知负担。", "qe": "What do you think of the “three-click rule”?", "te": "Click count matters less than whether every step is clear and low effort."}, {"r": 1, "c": "交互基础", "q": "空状态应该怎么设计？", "t": "解释为什么为空、引导下一步行动、视觉友好；区分首次使用、无结果、出错三类。", "qe": "How should an empty state be designed?", "te": "Explain why it's empty, guide the next action, keep it friendly; distinguish first use, no results, and error states."}, {"r": 1, "c": "交互基础", "q": "加载状态有哪些设计方式？各适用于什么场景？", "t": "骨架屏、进度条、Spinner、乐观更新；按时长与可预期性选择。", "qe": "What are the ways to design a loading state, and when does each fit?", "te": "Skeleton screens, progress bars, spinners, optimistic updates; choose by duration and predictability."}, {"r": 1, "c": "交互基础", "q": "如何设计一个好的错误提示？", "t": "说明发生了什么、为什么、怎么解决；位置靠近出错点、语言友好、不责怪用户。", "qe": "How do you design a good error message?", "te": "Say what happened, why, and how to fix it; place it near the problem, use friendly language, never blame the user."}, {"r": 1, "c": "交互基础", "q": "什么是渐进式披露？举一个例子。", "t": "先展示核心信息，高级选项按需展开，例如设置页的“高级设置”。", "qe": "What is progressive disclosure? Give an example.", "te": "Show the essentials first and reveal advanced options on demand, such as “Advanced settings”."}, {"r": 1, "c": "交互基础", "q": "移动端和桌面端在交互设计上的主要差异有哪些？", "t": "输入方式、屏幕尺寸、使用场景、手势、热区、网络环境。", "qe": "What are the main interaction differences between mobile and desktop?", "te": "Input method, screen size, context of use, gestures, touch targets, network conditions."}, {"r": 1, "c": "交互基础", "q": "手势交互有什么优缺点？如何降低学习成本？", "t": "高效但不可见；用引导、视觉暗示、提供按钮替代路径。", "qe": "What are the pros and cons of gesture-based interaction? How do you lower the learning curve?", "te": "Fast but invisible; use onboarding, visual hints, and button alternatives."}, {"r": 1, "c": "交互基础", "q": "如何确定一个按钮的大小和点击热区？", "t": "参考 iOS 44pt、Android 48dp，结合拇指热区与菲茨定律。", "qe": "How do you decide a button's size and tap target?", "te": "Use iOS 44pt and Android 48dp as baselines, plus thumb zones and Fitts's law."}, {"r": 1, "c": "交互基础", "q": "什么是功能可见性（Affordance）？", "t": "物体的外观暗示其用法，例如按钮的阴影暗示可点击；补充 signifier 概念。", "qe": "What is an affordance?", "te": "An object's appearance suggests how to use it, like a raised button suggesting it can be pressed; also mention signifiers."}, {"r": 1, "c": "交互基础", "q": "确认弹窗是不是越多越安全？", "t": "过多会导致习惯性点确认；更好的方案是撤销机制、危险操作二次输入。", "qe": "Are more confirmation dialogs always safer?", "te": "Too many train people to click OK blindly; undo and typed confirmation for destructive actions work better."}, {"r": 1, "c": "交互基础", "q": "撤销（Undo）和确认（Confirm）该如何取舍？", "t": "可逆操作优先撤销，不可逆且代价高的操作再用确认。", "qe": "How do you choose between Undo and Confirm?", "te": "Prefer undo for reversible actions; use confirmation only for irreversible, costly ones."}, {"r": 1, "c": "交互基础", "q": "表单设计有哪些常见的优化手段？", "t": "减少字段、合理分组、实时校验、智能默认值、标签位置、输入类型匹配键盘。", "qe": "What are common ways to improve a form?", "te": "Fewer fields, logical grouping, inline validation, smart defaults, label placement, input types that match the keyboard."}, {"r": 1, "c": "交互基础", "q": "你如何定义一个任务流程是否“顺畅”？", "t": "完成率、耗时、出错次数、用户主观评分。", "qe": "How do you define whether a task flow is “smooth”?", "te": "Completion rate, time on task, number of errors, subjective rating."}, {"r": 1, "c": "交互基础", "q": "如何为老年用户做适老化设计？", "t": "大字号与高对比、简化流程、减少手势、语音辅助、容错。", "qe": "How do you design for older adults?", "te": "Large type and high contrast, simpler flows, fewer gestures, voice support, forgiving input."}, {"r": 1, "c": "交互基础", "q": "什么是无障碍设计？你在项目中如何落实？", "t": "对比度、屏幕阅读器标签、键盘可达、不只依赖颜色传达信息。", "qe": "What is accessible design, and how do you apply it in projects?", "te": "Contrast, screen reader labels, keyboard access, never relying on color alone."}, {"r": 1, "c": "交互基础", "q": "微交互的价值是什么？举一个你喜欢的例子。", "t": "触发、规则、反馈、循环/模式四要素；举具体例子。", "qe": "What is the value of microinteractions? Share one you like.", "te": "Trigger, rules, feedback, loops and modes; give a concrete example."}, {"r": 1, "c": "交互基础", "q": "动效在交互中的作用有哪些？", "t": "引导注意、表达层级与空间关系、反馈状态、提升情感体验；避免过度。", "qe": "What role does motion play in interaction design?", "te": "Directing attention, showing hierarchy and spatial relationships, giving feedback, adding delight; avoid overdoing it."}, {"r": 1, "c": "交互基础", "q": "单页长流程和分步流程，你会怎么选择？", "t": "看字段量、逻辑依赖、用户中断风险；分步需显示进度。", "qe": "How do you choose between one long page and a multi-step flow?", "te": "Consider field count, logical dependencies, and the risk of interruption; steps need a progress indicator."}, {"r": 1, "c": "交互基础", "q": "下拉菜单、单选、分段控件分别适合什么场景？", "t": "按选项数量、是否需要对比、屏幕空间选择。", "qe": "When do you use a dropdown, radio buttons, or a segmented control?", "te": "Decide by the number of options, whether they need comparing, and available space."}, {"r": 1, "c": "交互基础", "q": "搜索功能的交互设计要考虑哪些环节？", "t": "入口、联想、历史、结果排序与筛选、无结果、纠错。", "qe": "What should you consider when designing search?", "te": "Entry point, suggestions, history, result ranking and filters, no results, typo correction."}, {"r": 1, "c": "交互基础", "q": "什么情况下应该用 Tab，什么情况下用分段控件？", "t": "Tab 用于平级内容切换，分段控件用于同一内容的不同视图。", "qe": "When should you use tabs versus a segmented control?", "te": "Tabs switch between peer sections of content; a segmented control switches views of the same content."}, {"r": 1, "c": "视觉与设计规范", "q": "你如何搭建或维护一套设计系统？", "t": "原子化：Token→组件→模式→文档；治理流程与版本管理。", "qe": "How do you build or maintain a design system?", "te": "Atomic layers: tokens → components → patterns → documentation, plus governance and versioning."}, {"r": 1, "c": "视觉与设计规范", "q": "设计 Token 是什么？为什么重要？", "t": "把颜色、字号、间距等抽象为变量，统一设计与开发、支持主题切换。", "qe": "What are design tokens, and why do they matter?", "te": "They turn color, type, spacing and more into variables, aligning design and code and enabling theming."}, {"r": 1, "c": "视觉与设计规范", "q": "如何定义一个产品的色彩体系？", "t": "品牌色、功能色、中性色，可访问性对比度，暗色模式适配。", "qe": "How do you define a product's color system?", "te": "Brand, functional and neutral colors, accessible contrast, dark mode adaptation."}, {"r": 1, "c": "视觉与设计规范", "q": "字体层级怎么建立？", "t": "基于模数比例或 4/8 倍数，限制层级数量，考虑行高与可读性。", "qe": "How do you build a type hierarchy?", "te": "Use a modular scale or 4/8 multiples, limit the number of levels, consider line height and legibility."}, {"r": 1, "c": "视觉与设计规范", "q": "你常用的栅格和间距规范是什么？", "t": "8pt 网格、列栅格、断点；说明为何选择。", "qe": "What grid and spacing system do you usually use?", "te": "8pt grid, column grids, breakpoints; explain why you chose them."}, {"r": 1, "c": "视觉与设计规范", "q": "暗黑模式设计需要注意什么？", "t": "不是简单反色：降低饱和度、层级用明度区分、避免纯黑、检查对比度。", "qe": "What matters when designing dark mode?", "te": "It's not a simple inversion: lower saturation, use lightness for elevation, avoid pure black, check contrast."}, {"r": 1, "c": "视觉与设计规范", "q": "视觉层级是如何建立的？", "t": "大小、颜色、对比、位置、留白；一屏只有一个主焦点。", "qe": "How is visual hierarchy established?", "te": "Size, color, contrast, position, whitespace; one primary focus per screen."}, {"r": 1, "c": "视觉与设计规范", "q": "你如何判断一个图标是否好用？", "t": "可识别、一致的风格、是否需要配文字、在小尺寸下的清晰度。", "qe": "How do you judge whether an icon works?", "te": "Recognizable, consistent in style, whether it needs a label, clarity at small sizes."}, {"r": 1, "c": "视觉与设计规范", "q": "组件库中一个按钮组件应该有哪些状态？", "t": "默认、悬停、按下、聚焦、禁用、加载，以及不同层级与尺寸。", "qe": "What states should a button component in a library have?", "te": "Default, hover, pressed, focus, disabled, loading, plus different emphasis levels and sizes."}, {"r": 1, "c": "视觉与设计规范", "q": "设计规范推不下去，团队成员不遵守，你会怎么做？", "t": "降低遵守成本（组件库）、建立评审机制、展示收益数据。", "qe": "Your design guidelines aren't being adopted and the team ignores them. What do you do?", "te": "Lower the cost of compliance with components, add review checkpoints, and show the payoff with data."}, {"r": 1, "c": "视觉与设计规范", "q": "多端（iOS/Android/Web）设计如何保持一致又尊重平台差异？", "t": "品牌与信息架构一致，控件和导航遵循平台习惯。", "qe": "How do you keep iOS, Android and web consistent while respecting platform differences?", "te": "Keep brand and information architecture consistent; follow platform conventions for controls and navigation."}, {"r": 1, "c": "视觉与设计规范", "q": "什么是格式塔原则？在界面中如何运用？", "t": "接近、相似、闭合、连续、共同命运等，用于分组与布局。", "qe": "What are the Gestalt principles, and how do you use them in interfaces?", "te": "Proximity, similarity, closure, continuity, common fate and more, used for grouping and layout."}, {"r": 1, "c": "设计流程与方法", "q": "说说你的完整设计流程。", "t": "理解需求→研究→定义问题→方案发散收敛→原型验证→交付→上线复盘，强调根据项目灵活裁剪。", "qe": "Walk me through your full design process.", "te": "Understand the brief → research → define the problem → diverge and converge → validate with prototypes → hand off → review after launch. Stress that you adapt it to each project."}, {"r": 1, "c": "设计流程与方法", "q": "拿到一个新需求，你首先会做什么？", "t": "弄清背景、目标、用户、约束和衡量指标，而不是马上画图。", "qe": "What's the first thing you do when you get a new request?", "te": "Clarify the background, goals, users, constraints and success metrics before drawing anything."}, {"r": 1, "c": "设计流程与方法", "q": "需求文档写得很模糊，你会怎么处理？", "t": "主动对齐：列问题清单、和 PM 拆解目标、补充研究。", "qe": "The requirements doc is vague. How do you handle it?", "te": "Align proactively: list open questions, break down goals with the PM, and fill gaps with research."}, {"r": 1, "c": "设计流程与方法", "q": "什么是双钻模型？你如何使用？", "t": "发现→定义→发展→交付，两次发散收敛，用于问题定义与方案设计。", "qe": "What is the Double Diamond, and how do you use it?", "te": "Discover → define → develop → deliver; two rounds of diverging and converging, for framing the problem and designing the solution."}, {"r": 1, "c": "设计流程与方法", "q": "低保真和高保真原型各在什么阶段使用？", "t": "低保真用于快速验证结构流程，高保真用于细节与可用性测试、交付。", "qe": "When do you use low-fidelity versus high-fidelity prototypes?", "te": "Low fidelity to test structure and flow quickly; high fidelity for detail, usability testing and handoff."}, {"r": 1, "c": "设计流程与方法", "q": "你如何做设计评审？", "t": "评审前明确目标与问题、评审中聚焦用户与目标、评审后跟进结论。", "qe": "How do you run a design review?", "te": "Before: set goals and questions. During: focus on users and goals. After: follow up on decisions."}, {"r": 1, "c": "设计流程与方法", "q": "你一般怎么和开发对接？如何保证还原度？", "t": "标注与组件对齐、交付前讲解、走查清单、建立问题追踪。", "qe": "How do you work with engineers, and how do you make sure the build matches the design?", "te": "Specs and components that match code, a walkthrough before handoff, a QA checklist, and issue tracking."}, {"r": 1, "c": "设计流程与方法", "q": "你如何给设计方案排优先级？", "t": "影响面 × 价值 ÷ 成本，结合业务节奏，可用 RICE 或 MoSCoW。", "qe": "How do you prioritize design work?", "te": "Reach × value ÷ cost, adjusted to business timing; RICE or MoSCoW can help."}, {"r": 1, "c": "设计流程与方法", "q": "用户旅程地图怎么画？它解决什么问题？", "t": "阶段、行为、触点、想法、情绪、痛点与机会点，用于全局视角找机会。", "qe": "How do you create a user journey map, and what problem does it solve?", "te": "Stages, actions, touchpoints, thoughts, emotions, pain points and opportunities, to find opportunities from an end-to-end view."}, {"r": 1, "c": "设计流程与方法", "q": "Persona（用户画像）怎么构建？你觉得它有用吗？", "t": "基于真实研究数据，而非拍脑袋；用于对齐团队对用户的认知。", "qe": "How do you build personas? Do you think they're useful?", "te": "Base them on real research, not guesses; they align the team's understanding of users."}, {"r": 1, "c": "设计流程与方法", "q": "什么是 MVP？设计师如何参与 MVP 的定义？", "t": "最小可验证产品，设计师帮助识别核心价值路径、砍掉非必要功能。", "qe": "What is an MVP, and how should designers help define it?", "te": "The smallest product that tests the idea; designers identify the core value path and cut what isn't essential."}, {"r": 1, "c": "设计流程与方法", "q": "设计中你如何平衡创新和用户习惯？", "t": "核心流程遵循习惯，在差异化价值点适度创新，并验证。", "qe": "How do you balance innovation with familiar patterns?", "te": "Follow conventions in core flows, innovate where it differentiates, and validate it."}, {"r": 1, "c": "设计流程与方法", "q": "你怎么写设计说明或设计文档？", "t": "背景、目标、方案、关键决策与理由、边界情况、埋点需求。", "qe": "How do you write a design spec or design doc?", "te": "Background, goals, solution, key decisions and rationale, edge cases, tracking requirements."}, {"r": 1, "c": "设计流程与方法", "q": "交付给开发的设计稿需要包含哪些内容？", "t": "各状态、边界与异常、动效说明、适配规则、切图或组件引用。", "qe": "What should a design handoff to engineering include?", "te": "All states, edge cases and errors, motion specs, responsive rules, assets or component references."}, {"r": 1, "c": "用户研究基础", "q": "你常用哪些用户研究方法？分别在什么阶段使用？", "t": "按定性/定量、态度/行为两维度划分，并对应项目阶段。", "qe": "Which user research methods do you use, and at what stage?", "te": "Map them on two axes, qualitative vs quantitative and attitudinal vs behavioral, and tie each to a project stage."}, {"r": 1, "c": "用户研究基础", "q": "用户访谈怎么设计提纲？", "t": "开放式问题、从一般到具体、避免引导、关注过去真实行为。", "qe": "How do you write an interview guide?", "te": "Open-ended questions, general to specific, no leading questions, focus on real past behavior."}, {"r": 1, "c": "用户研究基础", "q": "可用性测试一般找几个人？为什么？", "t": "Nielsen 5 人可发现约 85% 问题，适用于迭代式定性测试。", "qe": "How many participants do you need for a usability test, and why?", "te": "Nielsen's five users find about 85% of issues, for iterative qualitative testing."}, {"r": 1, "c": "用户研究基础", "q": "问卷设计有哪些常见的坑？", "t": "引导性问题、双重问题、选项不互斥、样本偏差、过长。", "qe": "What are common pitfalls in survey design?", "te": "Leading questions, double-barreled questions, overlapping options, sampling bias, surveys that are too long."}, {"r": 1, "c": "用户研究基础", "q": "用户说的和做的不一致，你信哪个？", "t": "更相信行为数据，但要理解背后的动机，两者结合。", "qe": "When what users say and what they do disagree, which do you trust?", "te": "Trust behavior more, but understand the motivation behind it, and combine both."}, {"r": 1, "c": "用户研究基础", "q": "你如何从访谈记录中提炼洞察？", "t": "转录→打标签→亲和图→提炼模式→形成可行动的洞察。", "qe": "How do you turn interview notes into insights?", "te": "Transcribe → tag → affinity map → find patterns → write actionable insights."}, {"r": 1, "c": "用户研究基础", "q": "没有预算和时间做用户研究时怎么办？", "t": "游击测试、内部同事测试、数据与客服反馈、竞品评论分析。", "qe": "What do you do when there's no budget or time for user research?", "te": "Guerrilla testing, testing with colleagues, data and support feedback, competitor review analysis."}, {"r": 1, "c": "用户研究基础", "q": "A/B 测试适合解决什么问题？不适合什么？", "t": "适合有明确指标的局部优化，不适合方向性、长期价值或小流量场景。", "qe": "What problems is A/B testing good for, and what is it not good for?", "te": "Good for local optimizations with a clear metric; not for direction-setting, long-term value, or low-traffic cases."}, {"r": 1, "c": "用户研究基础", "q": "卡片分类法怎么做？开放式和封闭式有何区别？", "t": "开放式让用户自建分组，封闭式验证已有分类。", "qe": "How do you run card sorting? What's the difference between open and closed sorts?", "te": "Open sorts let users create their own groups; closed sorts validate existing categories."}, {"r": 1, "c": "用户研究基础", "q": "SUS 量表是什么？如何使用？", "t": "10 题系统可用性量表，计算 0-100 分，68 分为平均。", "qe": "What is the SUS scale, and how do you use it?", "te": "A 10-item System Usability Scale scored 0–100, with 68 as average."}, {"r": 1, "c": "工具与协作", "q": "你主要使用哪些设计工具？为什么？", "t": "说工具选择背后的协作与效率考虑，而非罗列。", "qe": "Which design tools do you mainly use, and why?", "te": "Explain the collaboration and efficiency reasons behind your choices instead of listing tools."}, {"r": 1, "c": "工具与协作", "q": "你如何管理 Figma 文件和组件库？", "t": "页面结构、命名规范、组件变体、版本分支。", "qe": "How do you organize Figma files and component libraries?", "te": "Page structure, naming conventions, component variants, branching and versions."}, {"r": 1, "c": "工具与协作", "q": "你怎么看 AI 工具对设计工作的影响？你用过哪些？", "t": "具体用法与边界：提效的环节、需要人判断的环节。", "qe": "How do you see AI tools affecting design work? Which have you used?", "te": "Be specific about how you use them and their limits: what they speed up, and where human judgment is needed."}, {"r": 1, "c": "工具与协作", "q": "你如何用原型工具表达复杂交互？", "t": "按保真度选择工具，复杂动效可用 ProtoPie 或代码原型。", "qe": "How do you prototype complex interactions?", "te": "Choose tools by fidelity; use ProtoPie or code prototypes for complex motion."}, {"r": 1, "c": "工具与协作", "q": "你懂前端吗？了解到什么程度？", "t": "了解基本布局、组件化和实现成本，帮助沟通即可。", "qe": "Do you know front-end development? How deeply?", "te": "Knowing basic layout, components and implementation cost is enough to communicate well."}, {"r": 1, "c": "工具与协作", "q": "你和产品经理一般怎么分工？", "t": "PM 定义问题与目标，设计负责解法体验，边界上主动补位。", "qe": "How do you usually divide work with product managers?", "te": "The PM defines the problem and goals, design owns the solution and experience, and you step in at the edges."}, {"r": 1, "c": "工具与协作", "q": "你如何跟进一个功能上线后的表现？", "t": "埋点、看板、用户反馈、定期复盘。", "qe": "How do you track a feature's performance after launch?", "te": "Analytics events, dashboards, user feedback, regular reviews."}, {"r": 1, "c": "工具与协作", "q": "设计师需要懂数据吗？你平时看哪些数据？", "t": "需要；关注漏斗转化、留存、任务完成率、关键行为指标。", "qe": "Do designers need to understand data? Which metrics do you watch?", "te": "Yes; funnel conversion, retention, task completion, key behavior metrics."}, {"r": 1, "c": "交互细节", "q": "设计“登录注册页”时，需要考虑哪些状态和边界情况？", "t": "逐项检查：正常、空数据、加载中、出错、极端数据、无权限、网络异常；列完后挑一两个讲具体处理方式。", "qe": "What states and edge cases should you consider when designing a login and sign-up page?", "te": "Go through normal, empty, loading, error, extreme data, permission and network states, then pick one or two and explain how you'd handle them."}, {"r": 1, "c": "交互细节", "q": "设计“搜索框”时，需要考虑哪些状态和边界情况？", "t": "逐项检查：正常、空数据、加载中、出错、极端数据、无权限、网络异常；列完后挑一两个讲具体处理方式。", "qe": "What states and edge cases should you consider when designing a search box?", "te": "Go through normal, empty, loading, error, extreme data, permission and network sta
