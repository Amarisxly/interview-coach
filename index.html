      ncol=col;
      s.docChanges().forEach(c=>{
        const id=+c.doc.id.slice(1); if(isNaN(id)) return;
        if(c.type==="removed") delete NOTES[id];
        else { const v=c.doc.data(); if(v&&v.fav) NOTES[id]={fav:true,n:v.n||{},updatedAt:v.updatedAt}; }
      });
      syncFavs();
    },()=>{ncol=null});
  }catch(e){}
})();
function noteFields(q){
  // 字段键固定用中文标签（兼容已有笔记），显示名随语言切换
  const mk=lang=>{
    const f=fwOf(q.c,lang), en=lang==="en";
    let rows=[];
    if(f.viz==="flow"||f.viz==="funnel") rows=f.steps.map(s=>[s[1],s[2]]);
    else if(f.viz==="star") rows=f.star.map(s=>[`${s[0]} ${s[1]}`,s[2]]);
    else if(f.viz==="vs") rows=f.dims.map(d=>[d[0]===d[1]?d[0]:`${d[0]} / ${d[1]}`,en?"One line for each side":"两边各写一句"]);
    else rows=[[en?"What I'll focus on":"我会重点讲的部分",f.cells.map(c=>c[1]).join(en?", ":"、")]];
    return [[en?"One-line answer":"一句话结论",en?"Lead with the answer, then expand":"先给答案，再展开"],...rows,[en?"My example":"我的案例",en?"Which project or experience backs it up":"用哪个项目或经历来佐证"],[en?"Easy to forget":"易忘点",en?"Details you tend to miss in the moment":"面试时容易漏掉的细节"]];
  };
  const zh=mk("zh"), cu=mk(L);
  return zh.map((r,i)=>[r[0],cu[i][0],cu[i][1]]);
}
function noteHTML(id){
  const it=NOTES[id]; const n=it&&it.n?Object.entries(it.n).filter(([k,v])=>v&&v.trim()):[];
  if(!n.length) return `<div class="mynote" data-q="${id}" hidden></div>`;
  const lab={}; if(QS[id]) noteFields(QS[id]).forEach(r=>lab[r[0]]=r[1]);
  return `<div class="mynote" data-q="${id}"><div class="mn-h">${ms("edit_note","sm")}${tr("我的笔记","My notes")}<button class="mn-e" data-act="note">${tr("编辑","Edit")}</button></div><dl>${n.map(([k,v])=>`<dt>${esc(lab[k]||k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl></div>`;
}
let editing=null;
function openNote(q){
  editing=q; nextAt=0; stopSpeak();
  const it=NOTES[q.id]||{n:{}};
  const ci=Math.max(0,Object.keys(FW).indexOf(q.c))%8;
  const sh=$("#sheet"); sh.className="sheet tip tc"+ci;
  $("#shQ").textContent=qText(q);
  $("#shF").innerHTML=noteFields(q).map((r,i)=>`<label class="fld"><span><i class="no">${String(i+1).padStart(2,"0")}</i>${esc(r[1])}</span><textarea id="nf${i}" rows="2" data-k="${esc(r[0])}" placeholder="${esc(r[2])}">${esc((it.n||{})[r[0]]||"")}</textarea></label>`).join("");
  $("#sheetBg").hidden=false; sh.hidden=false;
  $("#shState").textContent = ncol?tr("仅你自己可见，换设备也能看到","Only you can see these, on any device"):tr("保存在这台设备的浏览器里","Saved in this device's browser");
}
function closeNote(){ $("#sheetBg").hidden=true; $("#sheet").hidden=true; editing=null }
async function writeNote(id){
  persistLocal();
  if(!ncol) return true;
  try{
    if(NOTES[id]) await ncol.doc("q"+id).set(NOTES[id]); else await ncol.doc("q"+id).delete();
    return true;
  }catch(e){ return false }
}
async function toggleFav(q){
  if(NOTES[q.id]){ openNote(q); return }
  NOTES[q.id]={fav:true,n:{},updatedAt:new Date().toISOString()};
  syncFavs(); openNote(q);
  if(!(await writeNote(q.id))) snack(tr("已收藏，暂时只保存在本机","Saved on this device for now"));
}
$("#shSave").onclick=async()=>{
  if(!editing) return;
  const n={}; $("#shF").querySelectorAll("textarea").forEach(t=>{ if(t.value.trim()) n[t.dataset.k]=t.value.trim() });
  const id=editing.id;
  NOTES[id]={fav:true,n,updatedAt:new Date().toISOString()};
  closeNote(); syncFavs();
  snack((await writeNote(id))?tr("笔记已保存","Notes saved"):tr("已保存到本机，稍后再同步","Saved on this device; will sync later"));
};
$("#shUnfav").onclick=async()=>{
  if(!editing) return;
  const id=editing.id; delete NOTES[id]; closeNote(); syncFavs();
  await writeNote(id); snack(tr("已从收藏移除","Removed from saved"));
};
$("#shClose").onclick=closeNote; $("#sheetBg").onclick=closeNote;
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&editing) closeNote() });

/* ---------- 语言切换 ---------- */
function applyStatic(){
  document.documentElement.lang = L==="en"?"en":"zh-CN";
  document.title = tr("设计面试陪练","Design Interview Coach");
  document.querySelectorAll("[data-en]").forEach(el=>{ if(el.dataset.zh==null) el.dataset.zh=el.textContent; el.textContent=L==="en"?el.dataset.en:el.dataset.zh });
  document.querySelectorAll("[data-enh]").forEach(el=>{ if(el.dataset.zhh==null) el.dataset.zhh=el.innerHTML; el.innerHTML=L==="en"?el.dataset.enh:el.dataset.zhh });
  document.querySelectorAll("[data-en-aria]").forEach(el=>{ if(el.dataset.zhAria==null) el.dataset.zhAria=el.getAttribute("aria-label"); el.setAttribute("aria-label",L==="en"?el.dataset.enAria:el.dataset.zhAria) });
  $("#lzh").setAttribute("aria-pressed",L==="zh"); $("#len").setAttribute("aria-pressed",L==="en");
  $("#langBtn").textContent = L==="en"?"中":"EN";
  if(window.__rv) window.__rv();
}
function setLang(l){
  if(l===L) return;
  L=l; S.lang=l; save(); stopSpeak(); nextAt=0;
  applyStatic(); renderMods(); loadVoices();
  if(editing) closeNote();
  if(!$("#play").hidden){ const keep=cur; renderFeed(keep>=0?keep:null); }
  snack(tr("已切换到中文","Switched to English"));
}
$("#lzh").onclick=()=>setLang("zh"); $("#len").onclick=()=>setLang("en");
$("#langBtn").onclick=()=>setLang(L==="en"?"zh":"en");

applyStatic(); renderMods(); bindSettings(); syncBar(); if(!TTS) applyVoice();
/* ---------- PWA：安装与离线 ---------- */
if("serviceWorker" in navigator && (location.protocol==="https:"||location.hostname==="localhost")){
  window.addEventListener("load",()=>{navigator.serviceWorker.register("./sw.js").catch(()=>{})});
}
let deferredPrompt=null;
const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone===true;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault(); deferredPrompt=e; if(!standalone) $("#installBtn").hidden=false});
$("#installBtn").onclick=async()=>{ if(!deferredPrompt) return; deferredPrompt.prompt(); const r=await deferredPrompt.userChoice; deferredPrompt=null; $("#installBtn").hidden=true; if(r.outcome==="accepted") snack(tr("已安装到桌面","Installed")) };
window.addEventListener("appinstalled",()=>{$("#installBtn").hidden=true});
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
if(isIOS && !standalone && !store.get("iosTipDone",false)) $("#iosTip").hidden=false;
$("#iosClose").onclick=()=>{$("#iosTip").hidden=true; store.set("iosTipDone",true)};
function netState(){let el=$(".offline"); if(navigator.onLine){el&&el.remove();return} if(!el){el=document.createElement("div");el.className="offline";document.body.appendChild(el)} el.textContent=tr("离线模式 · 题库和笔记照常可用","Offline · questions and notes still work")}
window.addEventListener("online",netState); window.addEventListener("offline",netState); netState();
if(location.hash==="#flow") start("flow"); else if(location.hash==="#fav") start("fav");

</script>
