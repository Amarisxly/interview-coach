w you'd handle them."}, {"r": 1, "c": "设计心理与法则", "q": "谈谈你对“菲茨定律”的理解，并举一个产品中的例子。", "t": "目标越大越近越好点；应用于按钮尺寸、屏幕边缘与角落。", "qe": "What is your understanding of Fitts's law? Give an example from a product.", "te": "Bigger and closer targets are easier to hit; apply it to button size and screen edges and corners."}, {"r": 1, "c": "设计心理与法则", "q": "谈谈你对“希克定律”的理解，并举一个产品中的例子。", "t": "选项越多决策越慢；应用于菜单精简、分步选择。", "qe": "What is your understanding of Hick's law? Give an example from a product.", "te": "More options mean slower decisions; apply it to trimming menus and splitting choices into steps."}, {"r": 1, "c": "设计心理与法则", "q": "谈谈你对“米勒定律（7±2）”的理解，并举一个产品中的例子。", "t": "短期记忆有限；用于信息分组，注意其常被误用。", "qe": "What is your understanding of Miller's law (7±2)? Give an example from a product.", "te": "Short-term memory is limited; use it for chunking information, and note it's often misused."}, {"r": 1, "c": "设计心理与法则", "q": "谈谈你对“雅各布定律”的理解，并举一个产品中的例子。", "t": "用户期待你的产品像他们常用的其他产品一样工作。", "qe": "What is your understanding of Jakob's law? Give an example from a product.", "te": "Users expect your product to work like the other products they already use."}, {"r": 1, "c": "设计心理与法则", "q": "谈谈你对“泰斯勒复杂度守恒定律”的理解，并举一个产品中的例子。", "t": "复杂度不会消失，只能转移；思考由系统还是用户承担。", "qe": "What is your understanding of Tesler's law of conservation of complexity? Give an example from a product.", "te": "Complexity can't be removed, only moved; decide whether the system or the user carries it."}, {"r": 1, "c": "设计心理与法则", "q": "谈谈你对“多尔蒂阈值”的理解，并举一个产品中的例子。", "t": "响应低于 400ms 保持用户心流；用于性能与加载设计。", "qe": "What is your understanding of the Doherty threshold? Give an example from a product.", "te": "Responses under 400ms keep users in flow; apply it to performance and loading design."}, {"r": 1, "c": "设计心理与法则", "q": "谈谈你对“峰终定律”的理解，并举一个产品中的例子。", "t": "体验评价取决于峰值和结尾；用于设计关键时刻与结束页。", "qe": "What is your understanding of the peak-end rule? Give an example from a product.", "te": "People judge an experience by its peak and its end; design key moments and end screens."}, {"r": 1, "c": "设计心理与法则", "q": "谈谈你对“冯·雷斯托夫效应”的理解，并举一个产品中的例子。", "t": "与众不同的元素更容易被记住；用于突出主操作。", "qe": "What is your understanding of the von Restorff effect? Give an example from a product.", "te": "Something that stands out is remembered; use it to highlight the primary action."}, {"r": 1, "c": "设计心理与法则", "q": "谈谈你对“系列位置效应”的理解，并举一个产品中的例子。", "t": "首尾项更易被记住；用于导航与列表排序。", "qe": "What is your understanding of the serial position effect? Give an example from a product.", "te": "First and last items are remembered best; apply it to navigation and list order."}, {"r": 1, "c": "设计心理与法则", "q": "谈谈你对“美即好用效应”的理解，并举一个产品中的例子。", "t": "美观的界面让用户更宽容；但不能掩盖可用性问题。", "qe": "What is your understanding of the aesthetic-usability effect? Give an example from a product.", "te": "Attractive interfaces make users more forgiving, but they don't fix usability problems."}, {"r": 1, "c": "设计心理与法则", "q": "谈谈你对“奥卡姆剃刀”的理解，并举一个产品中的例子。", "t": "如无必要勿增实体；用于精简功能与界面。", "qe": "What is your understanding of Occam's razor? Give an example from a product.", "te": "Don't add what isn't needed; use it to simplify features and interfaces."}, {"r": 1, "c": "设计心理与法则", "q": "谈谈你对“帕累托法则”的理解，并举一个产品中的例子。", "t": "80% 的使用集中于 20% 的功能；用于优先级排序。", "qe": "What is your understanding of the Pareto principle? Give an example from a product.", "te": "80% of usage comes from 20% of features; use it to prioritize."}, {"r": 1, "c": "设计心理与法则", "q": "谈谈你对“目标梯度效应”的理解，并举一个产品中的例子。", "t": "离目标越近动力越强；用于进度条与积分设计。", "qe": "What is your understanding of the goal-gradient effect? Give an example from a product.", "te": "Motivation rises as the goal gets closer; apply it to progress bars and points."}, {"r": 1, "c": "设计心理与法则", "q": "谈谈你对“蔡格尼克效应”的理解，并举一个产品中的例子。", "t": "人对未完成任务记忆更深；用于资料完善度提示。", "qe": "What is your understanding of the Zeigarnik effect? Give an example from a product.", "te": "People remember unfinished tasks; use it for profile completion prompts."}, {"r": 1, "c": "设计心理与法则", "q": "谈谈你对“心智模型”的理解，并举一个产品中的例子。", "t": "用户对系统如何工作的预期；设计需贴合或引导重建。", "qe": "What is your understanding of mental models? Give an example from a product.", "te": "Users' expectations of how a system works; design to match them or reshape them."}, {"r": 1, "c": "设计心理与法则", "q": "谈谈你对“认知负荷理论”的理解，并举一个产品中的例子。", "t": "区分内在、外在、相关负荷；减少外在负荷。", "qe": "What is your understanding of cognitive load theory? Give an example from a product.", "te": "Separate intrinsic, extraneous and germane load, and reduce the extraneous kind."}, {"r": 1, "c": "设计心理与法则", "q": "谈谈你对“损失厌恶”的理解，并举一个产品中的例子。", "t": "失去的痛感大于得到的快乐；常用于挽留与营销，注意伦理。", "qe": "What is your understanding of loss aversion? Give an example from a product.", "te": "Losses hurt more than gains feel good; often used in retention and marketing, so watch the ethics."}, {"r": 1, "c": "设计心理与法则", "q": "谈谈你对“默认效应”的理解，并举一个产品中的例子。", "t": "用户倾向于接受默认选项；默认值要服务用户利益。", "qe": "What is your understanding of the default effect? Give an example from a product.", "te": "People tend to accept defaults, so defaults should serve users' interests."}, {"r": 1, "c": "设计心理与法则", "q": "谈谈你对“锚定效应”的理解，并举一个产品中的例子。", "t": "首个信息影响判断；用于价格展示，注意不诱导。", "qe": "What is your understanding of the anchoring effect? Give an example from a product.", "te": "The first number shapes judgment; relevant to pricing, so don't use it to mislead."}, {"r": 1, "c": "设计心理与法则", "q": "谈谈你对“社会认同”的理解，并举一个产品中的例子。", "t": "人倾向于跟随他人；用于评价、销量展示。", "qe": "What is your understanding of social proof? Give an example from a product.", "te": "People follow others; used in ratings and sales counts."}, {"r": 1, "c": "设计心理与法则", "q": "谈谈你对“暗黑模式（Dark Patterns）”的理解，并举一个产品中的例子。", "t": "诱导用户违背意愿的设计；谈你如何识别和拒绝。", "qe": "What is your understanding of dark patterns? Give an example from a product.", "te": "Designs that trick users into acting against their intent; explain how you spot and refuse them."}, {"r": 1, "c": "设计心理与法则", "q": "谈谈你对“Kano 模型”的理解，并举一个产品中的例子。", "t": "基本型、期望型、兴奋型需求；用于功能优先级判断。", "qe": "What is your understanding of the Kano model? Give an example from a product.", "te": "Basic, performance and delight needs; use it to prioritize features."}, {"r": 2, "c": "项目深挖", "q": "这个项目的业务目标是什么？设计目标又是什么？两者如何对应？", "t": "把业务指标拆解为可设计的用户行为目标。", "qe": "What were the business goals of this project, and the design goals? How do they connect?", "te": "Break business metrics down into user behavior goals that design can influence."}, {"r": 2, "c": "项目深挖", "q": "你是怎么发现这个问题的？是需求驱动还是你主动发现的？", "t": "体现主动性：数据、反馈或走查中发现问题的过程。", "qe": "How did you discover this problem? Was it a request or did you find it yourself?", "te": "Show initiative: how you spotted it in data, feedback, or an audit."}, {"r": 2, "c": "项目深挖", "q": "这个方案你做了几版？为什么最终选了这一版？", "t": "展示发散与收敛过程，以及选择依据（数据、测试、约束）。", "qe": "How many versions did you make, and why did you choose this one?", "te": "Show how you diverged and converged, and what drove the choice: data, testing, constraints."}, {"r": 2, "c": "项目深挖", "q": "项目里最大的阻力来自哪里？你怎么推动的？", "t": "识别利益相关方的顾虑，用数据或原型说服，找到共同目标。", "qe": "Where did the biggest resistance come from, and how did you push it through?", "te": "Identify stakeholders' concerns, persuade with data or prototypes, find a shared goal."}, {"r": 2, "c": "项目深挖", "q": "如果当时开发资源只有一半，你会怎么砍方案？", "t": "保留核心价值路径，分期上线，说明取舍原则。", "qe": "If you'd had only half the engineering resources, what would you have cut?", "te": "Keep the core value path, ship in phases, and explain your principles for cutting."}, {"r": 2, "c": "项目深挖", "q": "你如何证明这个改版是有效的，而不是自然增长？", "t": "对照实验、排除季节与运营因素、多指标交叉验证。", "qe": "How do you prove the redesign worked rather than natural growth?", "te": "Controlled experiments, ruling out seasonality and campaigns, cross-checking several metrics."}, {"r": 2, "c": "项目深挖", "q": "项目中你和 PM 有过分歧吗？最后谁说服了谁？", "t": "讲分歧本质、各自依据、如何达成共识，避免抹黑对方。", "qe": "Did you disagree with the PM on this project? Who convinced whom?", "te": "Explain the core disagreement, each side's reasoning, and how you reached agreement, without blaming them."}, {"r": 2, "c": "项目深挖", "q": "这个项目的用户研究是怎么做的？样本怎么选的？", "t": "研究方法、样本代表性、发现如何影响方案。", "qe": "How did you do user research for this project, and how did you choose participants?", "te": "Methods, how representative the sample was, how findings shaped the design."}, {"r": 2, "c": "项目深挖", "q": "项目上线后有没有出现你没预料到的问题？", "t": "真实复盘：问题、原因、修复与预防机制。", "qe": "Did anything unexpected go wrong after launch?", "te": "An honest review: the problem, the cause, the fix and how you prevent it."}, {"r": 2, "c": "项目深挖", "q": "这个设计在不同终端上是怎么适配的？", "t": "响应式策略、平台差异的处理。", "qe": "How did this design adapt across different devices?", "te": "Your responsive strategy and how you handled platform differences."}, {"r": 2, "c": "项目深挖", "q": "这个功能的埋点是你提的吗？你关注哪几个指标？", "t": "主指标、护栏指标、过程指标的设计。", "qe": "Did you define the tracking for this feature? Which metrics did you focus on?", "te": "Primary metrics, guardrail metrics and process metrics."}, {"r": 2, "c": "项目深挖", "q": "你在项目中做的最难的一个权衡是什么？", "t": "具体冲突（体验 vs 商业 / 速度 vs 质量）与决策依据。", "qe": "What was the hardest trade-off you made in this project?", "te": "A specific conflict (experience vs business, speed vs quality) and how you decided."}, {"r": 2, "c": "项目深挖", "q": "这个项目如果放在我们公司的业务里，你会怎么做？", "t": "体现迁移能力，事先研究过对方业务更好。", "qe": "If this project were part of our business, how would you approach it?", "te": "Show you can transfer your skills; researching their business beforehand helps."}, {"r": 2, "c": "项目深挖", "q": "你觉得这个项目体现了你的哪项核心能力？还缺什么？", "t": "自我认知清晰，能指出短板与提升计划。", "qe": "Which core skill does this project show, and what was missing?", "te": "Show clear self-awareness, naming a gap and your plan to improve."}, {"r": 2, "c": "项目深挖", "q": "你提到做了竞品分析，结论是什么？对方案有什么影响？", "t": "竞品结论要落到具体设计决策上。", "qe": "You mentioned competitor analysis. What did you conclude, and how did it affect the design?", "te": "Competitor findings should lead to specific design decisions."}, {"r": 2, "c": "项目深挖", "q": "这个流程原来有几步，你改成了几步？用户真的更快了吗？", "t": "步数不等于效率，看耗时与完成率。", "qe": "How many steps did the flow have before and after? Were users actually faster?", "te": "Fewer steps isn't always faster; look at time on task and completion rate."}, {"r": 2, "c": "项目深挖", "q": "你如何说服老板接受一个短期会降低指标的设计？", "t": "长期价值论证、小流量实验、风险控制方案。", "qe": "How do you convince leadership to accept a design that lowers a metric in the short term?", "te": "Make the long-term case, run a small-traffic experiment, and offer a risk plan."}, {"r": 2, "c": "项目深挖", "q": "项目周期多长？时间是怎么分配的？", "t": "体现节奏把控与预估能力。", "qe": "How long was the project, and how did you allocate the time?", "te": "Show that you can pace work and estimate well."}, {"r": 2, "c": "项目深挖", "q": "这个项目里你有没有做过“设计之外”的事？", "t": "补位：推动研究、写需求、协调资源等。", "qe": "Did you do anything “outside design” on this project?", "te": "Stepping up: driving research, writing requirements, coordinating resources."}, {"r": 2, "c": "项目深挖", "q": "在这个项目中，你从用户那里学到最意外的一件事是什么？", "t": "体现真实的研究投入和对假设的修正。", "qe": "What was the most surprising thing you learned from users on this project?", "te": "Show genuine research effort and how it changed your assumptions."}, {"r": 2, "c": "产品思维", "q": "你如何理解用户需求和产品需求的区别？", "t": "用户说的是表层诉求，产品需求是经过分析后的解决方案。", "qe": "How do you see the difference between user needs and product requirements?", "te": "Users state surface wants; product requirements are the solutions you arrive at after analysis."}, {"r": 2, "c": "产品思维", "q": "如何判断一个需求值不值得做？", "t": "用户价值、商业价值、实现成本、战略契合度。", "qe": "How do you decide whether a request is worth doing?", "te": "User value, business value, cost to build, strategic fit."}, {"r": 2, "c": "产品思维", "q": "老板提了一个你认为不合理的需求，你会怎么办？", "t": "先理解背后目标，再给出替代方案并用数据或原型沟通。", "qe": "Your manager asks for something you think is unreasonable. What do you do?", "te": "First understand the goal behind it, then offer an alternative and make the case with data or a prototype."}, {"r": 2, "c": "产品思维", "q": "你怎么看待“用户想要一匹更快的马”？", "t": "需求背后是动机，要挖掘本质问题而非照单全收。", "qe": "What do you think of “users would have asked for a faster horse”?", "te": "Requests hide motivations; dig for the underlying problem instead of taking requests literally."}, {"r": 2, "c": "产品思维", "q": "产品的北极星指标怎么定？设计如何对齐？", "t": "反映核心价值的单一指标，设计目标拆解到用户行为。", "qe": "How do you set a product's North Star metric, and how does design align with it?", "te": "One metric that reflects core value; break design goals down into user behaviors."}, {"r": 2, "c": "产品思维", "q": "增长和体验冲突时你怎么选？", "t": "区分短期与长期，设定护栏指标，找两者兼顾的方案。", "qe": "When growth and experience conflict, how do you choose?", "te": "Separate short term from long term, set guardrail metrics, and look for a solution that serves both."}, {"r": 2, "c": "产品思维", "q": "一个功能用的人很少，应该砍掉还是优化入口？", "t": "先诊断：是入口问题、价值问题还是人群问题，再决策。", "qe": "Few people use a feature. Should you remove it or improve its entry point?", "te": "Diagnose first: is it discoverability, value, or the wrong audience? Then decide."}, {"r": 2, "c": "产品思维", "q": "如何设计一个让用户愿意付费的会员体系？", "t": "核心权益感知、免费与付费的边界、试用与转化时机、续费体验。", "qe": "How do you design a membership program people are willing to pay for?", "te": "Clear core benefits, the line between free and paid, trial and conversion timing, renewal experience."}, {"r": 2, "c": "产品思维", "q": "你怎么看待产品中的“打扰”设计，比如推送和弹窗？", "t": "频控、相关性、用户可控、价值交换。", "qe": "What do you think about interruptive patterns like push notifications and pop-ups?", "te": "Frequency caps, relevance, user control, a fair value exchange."}, {"r": 2, "c": "产品思维", "q": "平台型产品如何平衡多方（如买家、卖家）的体验？", "t": "识别各方核心诉求，找到双赢点，规则透明。", "qe": "How does a marketplace balance the experience of different sides, like buyers and sellers?", "te": "Identify each side's core needs, find win-win points, keep the rules transparent."}, {"r": 2, "c": "产品思维", "q": "如何提升一个工具类产品的留存？", "t": "核心价值快速触达、习惯养成、数据沉淀带来的迁移成本。", "qe": "How do you improve retention for a utility product?", "te": "Deliver core value fast, build habits, and let accumulated data raise switching costs."}, {"r": 2, "c": "产品思维", "q": "从 0 到 1 做一个产品，设计师应该关注什么？", "t": "核心场景验证、最小闭环、快速迭代，而非视觉精致度。", "qe": "When building a product from zero to one, what should designers focus on?", "te": "Validating the core scenario, a minimal end-to-end loop, fast iteration, not visual polish."}, {"r": 2, "c": "产品思维", "q": "成熟产品的体验优化应该从哪里入手？", "t": "数据漏斗、用户反馈、体验走查，找高频高痛点。", "qe": "Where should you start improving the experience of a mature product?", "te": "Funnel data, user feedback and experience audits, to find frequent, painful problems."}, {"r": 2, "c": "产品思维", "q": "你怎么看待产品的“功能膨胀”问题？", "t": "做减法的机制：功能分层、个性化、定期清理。", "qe": "What do you think about feature bloat?", "te": "Build ways to subtract: tiered features, personalization, regular cleanup."}, {"r": 2, "c": "产品思维", "q": "ToB 和 ToC 产品的设计有什么本质区别？", "t": "决策者与使用者分离、效率与准确优先、复杂权限与配置。", "qe": "What's the fundamental difference between designing B2B and B2C products?", "te": "Buyers and users are different people, efficiency and accuracy come first, permissions and configuration are complex."}, {"r": 2, "c": "产品思维", "q": "如何衡量一个设计的商业价值？", "t": "转化、留存、客单价、效率提升、成本降低等可量化指标。", "qe": "How do you measure the business value of a design?", "te": "Quantifiable metrics such as conversion, retention, order value, efficiency gains, cost savings."}, {"r": 2, "c": "产品思维", "q": "你认为设计师在团队中的核心价值是什么？", "t": "代表用户、提升决策质量、把模糊问题具象化。", "qe": "What do you think is a designer's core value on a team?", "te": "Representing users, improving decision quality, making fuzzy problems concrete."}, {"r": 2, "c": "产品思维", "q": "讲一个你从用户反馈中发现产品机会的例子。", "t": "反馈→聚类分析→验证→方案→结果。", "qe": "Tell me about a product opportunity you found through user feedback.", "te": "Feedback → clustering → validation → solution → results."}, {"r": 2, "c": "产品思维", "q": "用户分层运营中，设计可以做什么？", "t": "针对新手、活跃、沉默用户的差异化界面与引导。", "qe": "What can design contribute to segmented user operations?", "te": "Different interfaces and guidance for new, active and dormant users."}, {"r": 2, "c": "产品思维", "q": "如何设计新用户的首次体验（Onboarding）？", "t": "尽快让用户感受核心价值（Aha moment），减少前置门槛。", "qe": "How do you design the onboarding experience for new users?", "te": "Get users to the core value (the aha moment) quickly and lower the upfront barriers."}, {"r": 2, "c": "数据与验证", "q": "你如何设计一次 A/B 实验？", "t": "假设、指标、样本量、分流、实验周期、显著性判断。", "qe": "How do you design an A/B experiment?", "te": "Hypothesis, metrics, sample size, traffic split, duration, significance."}, {"r": 2, "c": "数据与验证", "q": "A/B 测试结果不显著，你会怎么办？", "t": "检查样本量与周期、细分人群、反思假设，必要时定性研究补充。", "qe": "Your A/B test result isn't significant. What do you do?", "te": "Check sample size and duration, segment users, revisit the hypothesis, and add qualitative research if needed."}, {"r": 2, "c": "数据与验证", "q": "定性研究和定量数据冲突时怎么处理？", "t": "定量告诉你发生了什么，定性告诉你为什么；交叉验证。", "qe": "How do you handle conflicts between qualitative research and quantitative data?", "te": "Quant tells you what happened; qual tells you why. Cross-check them."}, {"r": 2, "c": "数据与验证", "q": "如何搭建一个产品的体验度量体系？", "t": "可参考 HEART 模型：愉悦、参与、接受、留存、任务完成。", "qe": "How do you build an experience measurement framework for a product?", "te": "Consider the HEART model: happiness, engagement, adoption, retention, task success."}, {"r": 2, "c": "数据与验证", "q": "NPS 有什么局限性？", "t": "无法解释原因、受文化影响、与实际行为关联有限。", "qe": "What are the limitations of NPS?", "te": "It can't explain why, it varies by culture, and it links weakly to actual behavior."}, {"r": 2, "c": "数据与验证", "q": "如何通过漏斗分析找到体验问题？", "t": "定位流失最大的环节，结合录屏和访谈找原因。", "qe": "How do you use funnel analysis to find experience problems?", "te": "Find the step with the biggest drop-off, then use recordings and interviews to find out why."}, {"r": 2, "c": "数据与验证", "q": "你如何避免被“虚荣指标”误导？", "t": "关注与核心价值相关的行为指标，而非 PV 等表面数据。", "qe": "How do you avoid being misled by vanity metrics?", "te": "Focus on behaviors tied to core value rather than surface numbers like page views."}, {"r": 2, "c": "数据与验证", "q": "如果没有数据支持，你怎么证明你的设计更好？", "t": "可用性测试、专家评审、原型对比测试、启发式评估。", "qe": "Without data, how do you prove your design is better?", "te": "Usability testing, expert review, prototype comparison tests, heuristic evaluation."}, {"r": 2, "c": "复杂场景与协作", "q": "同时接到三个紧急需求，你怎么排？", "t": "评估影响与紧急度，和相关方透明沟通，必要时上升。", "qe": "Three urgent requests arrive at once. How do you prioritize?", "te": "Assess impact and urgency, communicate openly with stakeholders, escalate if needed."}, {"r": 2, "c": "复杂场景与协作", "q": "开发说你的设计实现不了，你怎么办？", "t": "先理解技术约束，寻找替代方案，评估体验损失是否可接受。", "qe": "An engineer says your design can't be built. What do you do?", "te": "Understand the technical constraint first, look for alternatives, and judge whether the experience loss is acceptable."}, {"r": 2, "c": "复杂场景与协作", "q": "上线前一天发现了一个体验问题，要不要推迟？", "t": "评估严重程度与影响面，给出风险方案供决策。", "qe": "You find an experience problem the day before launch. Do you delay?", "te": "Assess severity and reach, and present options with their risks so the team can decide."}, {"r": 2, "c": "复杂场景与协作", "q": "你如何在一个强运营驱动的团队中坚持体验底线？", "t": "建立体验规范和评审红线，用数据说明长期伤害。", "qe": "How do you hold the line on experience in a team driven by short-term operations?", "te": "Set experience guidelines and review red lines, and use data to show the long-term harm."}, {"r": 2, "c": "复杂场景与协作", "q": "跨团队项目中，你如何保证体验的一致性？", "t": "统一规范、设计接口人、定期对齐会议。", "qe": "How do you keep the experience consistent across teams?", "te": "Shared guidelines, a design point of contact, regular alignment meetings."}, {"r": 2, "c": "复杂场景与协作", "q": "设计评审时，各方意见都不一样，你怎么收敛？", "t": "回到目标和用户，区分主观偏好与客观问题。", "qe": "Everyone has different opinions in a design review. How do you converge?", "te": "Go back to goals and users, and separate personal taste from real problems."}, {"r": 2, "c": "复杂场景与协作", "q": "你接手了一个别人做了一半的项目，怎么开展？", "t": "先梳理已有决策与原因，避免推倒重来，找关键风险。", "qe": "You take over a project someone else left halfway. How do you start?", "te": "First understand the decisions already made and why, avoid starting over, and find the key risks."}, {"r": 2, "c": "复杂场景与协作", "q": "如果业务方要求你抄竞品，你会怎么做？", "t": "分析竞品为什么这样设计，结合自身用户与场景做判断。", "qe": "The business team asks you to copy a competitor. What do you do?", "te": "Analyze why the competitor designed it that way, then judge based on your own users and context."}, {"r": 2, "c": "复杂场景与协作", "q": "需求频繁变更，你如何应对？", "t": "理解变更原因，设计模块化方案，建立变更评估流程。", "qe": "Requirements keep changing. How do you cope?", "te": "Understand why they change, design modular solutions, and set up a change review process."}, {"r": 2, "c": "复杂场景与协作", "q": "如何推动一个不在 KPI 里但对体验很重要的优化？", "t": "找到它与业务指标的关联，小成本试点，用结果说话。", "qe": "How do you push an optimization that matters for experience but isn't in anyone's KPIs?", "te": "Link it to a business metric, pilot it cheaply, and let the results speak."}, {"r": 2, "c": "设计实战题", "q": "请为一个在线点餐小程序做一个设计：缩短从进店到下单的时间。说说你的思路。", "t": "5 步作答：澄清目标与约束 → 明确用户与场景 → 拆解关键问题 → 提出 1-2 个方案并说明取舍 → 如何衡量效果。", "qe": "Design for an online food-ordering mini program: shorten the time from walking in to placing an order. Walk me through your approach.", "te": "Answer in five steps: clarify goals and constraints → define users and context → break down the key problems → propose one or two solutions and explain trade-offs → explain how you'd measure impact."}, {"r": 2, "c": "设计实战题", "q": "请为一个视频会议软件做一个设计：为听障用户提供更好的参会体验。说说你的思路。", "t": "5 步作答：澄清目标与约束 → 明确用户与场景 → 拆解关键问题 → 提出 1-2 个方案并说明取舍 → 如何衡量效果。", "qe": "Design for a video meeting app: give deaf and hard-of-hearing users a better meeting experience. Walk me through your approach.", "te": "Answer in five steps: clarify goals and constraints → define users and context → break down the key problems → propose one or two solutions and explain trade-offs → explain how you'd measure impact."}, {"r": 2, "c": "设计实战题", "q": "请为一个记账 App做一个设计：让用户坚持记账超过 30 天。说说你的思路。", "t": "5 步作答：澄清目标与约束 → 明确用户与场景 → 拆解关键问题 → 提出 1-2 个方案并说明取舍 → 如何衡量效果。", "qe": "Design for a budgeting app: get users to keep logging expenses for more than 30 days. Walk me through your approach.", "te": "Answer in five steps: clarify goals and constraints → define users and 出方案并验证。", "qe": "The review rate of a hotel platform has suddenly changed. As a designer, how would you investigate and respond?", "te": "First confirm the data is real (tracking, definitions) → break it down by time, channel, version, user group and platform → consider internal and external factors (releases, campaigns, competitors, holidays) → locate the step → add qualitative research → propose and validate a fix."}, {"r": 2, "c": "数据诊断", "q": "一个改版后的 App的首页点击率突然出现明显变化，作为设计师你会如何排查和应对？", "t": "先确认数据真实（埋点/口径）→ 拆维度（时间、渠道、版本、人群、平台）→ 内外部因素（发版、活动、竞品、节假日）→ 定位环节 → 定性补充 → 提出方案并验证。", "qe": "The home screen click-through rate of a redesigned app has suddenly changed. As a designer, how would you investigate and respond?", "te": "First confirm the data is real (tracking, definitions) → break it down by time, channel, version, user group and platform → consider internal and external factors (releases, campaigns, competitors, holidays) → locate the step → add qualitative research → propose and validate a fix."}, {"r": 3, "c": "职业规划与动机", "q": "你未来 3 到 5 年的职业规划是什么？", "t": "方向清晰（专业线或管理线），与公司发展路径匹配，有阶段性目标。", "qe": "What is your career plan for the next three to five years?", "te": "A clear direction (individual contributor or management) that fits the company's path, with milestones."}, {"r": 3, "c": "职业规划与动机", "q": "你为什么离开上一家公司？", "t": "积极归因：寻求成长与更匹配的平台，不抱怨前东家。", "qe": "Why did you leave your last company?", "te": "Frame it positively: seeking growth and a better fit. Don't criticize your former employer."}, {"r": 3, "c": "职业规划与动机", "q": "你为什么选择我们公司？", "t": "具体到业务、产品、团队或文化，体现提前做过功课。", "qe": "Why did you choose our company?", "te": "Be specific about the business, product, team or culture to show you've done your homework."}, {"r": 3, "c": "职业规划与动机", "q": "你对这个岗位的理解是什么？", "t": "核心职责、挑战和你能带来的价值。", "qe": "How do you understand this role?", "te": "Core responsibilities, the challenges, and the value you bring."}, {"r": 3, "c": "职业规划与动机", "q": "如果入职，前 90 天你打算怎么做？", "t": "30 天了解业务与团队、60 天做出小成果、90 天提出改进规划。", "qe": "If you join, what would you do in your first 90 days?", "te": "30 days to learn the business and team, 60 days to deliver a small win, 90 days to propose an improvement plan."}, {"r": 3, "c": "职业规划与动机", "q": "你更想走专业路线还是管理路线？", "t": "真实想法与依据，说明在现阶段的准备。", "qe": "Do you prefer an individual contributor track or a management track?", "te": "Your honest view and reasoning, and how you're preparing for it now."}, {"r": 3, "c": "职业规划与动机", "q": "你现在手上还有其他 offer 吗？", "t": "如实但有分寸，表达对本岗位的优先意向。", "qe": "Do you have other offers right now?", "te": "Be honest but measured, and say this role is your priority."}, {"r": 3, "c": "职业规划与动机", "q": "你觉得自己最大的优点和缺点是什么？", "t": "缺点要真实且在改进中，不要说伪缺点。", "qe": "What are your greatest strength and weakness?", "te": "The weakness should be real and something you're working on, not a disguised strength."}, {"r": 3, "c": "职业规划与动机", "q": "你期望在这个岗位上学到什么？", "t": "与岗位挑战相关的具体能力，避免只谈索取。", "qe": "What do you hope to learn in this role?", "te": "Specific skills tied to the role's challenges; don't only talk about what you'll get."}, {"r": 3, "c": "职业规划与动机", "q": "过去一年你读过最有收获的一本书或文章是什么？", "t": "讲它如何改变了你的工作方式。", "qe": "What's the most valuable book or article you read in the past year?", "te": "Explain how it changed the way you work."}, {"r": 3, "c": "职业规划与动机", "q": "你理想的工作环境是什么样的？", "t": "与公司文化做匹配，说出具体特征。", "qe": "What is your ideal work environment?", "te": "Match it to the company culture and name specific traits."}, {"r": 3, "c": "职业规划与动机", "q": "如果这次面试没通过，你会怎么想？", "t": "成熟心态：复盘、继续提升，表达对公司的兴趣。", "qe": "If you don't get this offer, how will you feel?", "te": "A mature attitude: reflect, keep improving, and express continued interest."}, {"r": 3, "c": "职业规划与动机", "q": "你平时如何保持专业成长？", "t": "具体渠道与实践：阅读、社区、副业项目、分享输出。", "qe": "How do you keep growing professionally?", "te": "Specific channels and practices: reading, communities, side projects, sharing your work."}, {"r": 3, "c": "职业规划与动机", "q": "你认为五年后设计师这个职业会是什么样？", "t": "结合 AI 与行业趋势，谈设计师价值的变化和你的准备。", "qe": "What do you think the designer's role will look like in five years?", "te": "Draw on AI and industry trends, how the designer's value shifts, and how you're preparing."}, {"r": 3, "c": "职业规划与动机", "q": "你的期望薪资是多少？依据是什么？", "t": "基于市场行情、自身能力和当前薪资给出合理区间。", "qe": "What are your salary expectations, and what are they based on?", "te": "Give a reasonable range based on market rates, your skills and current pay."}, {"r": 3, "c": "团队与领导力", "q": "你如何与一个强势的产品经理合作？", "t": "尊重专业分工、以用户和数据为依据、建立信任。", "qe": "How do you work with a very assertive product manager?", "te": "Respect each other's expertise, ground discussions in users and data, build trust."}, {"r": 3, "c": "团队与领导力", "q": "你和上级意见不一致时会怎么处理？", "t": "充分表达依据，接受决策后全力执行，必要时用结果复盘。", "qe": "How do you handle disagreements with your manager?", "te": "Make your case fully, commit once a decision is made, and review with results if needed."}, {"r": 3, "c": "团队与领导力", "q": "你带过新人吗？怎么带的？", "t": "目标设定、示范、反馈、逐步放手。", "qe": "Have you mentored junior designers? How?", "te": "Set goals, demonstrate, give feedback, gradually let go."}, {"r": 3, "c": "团队与领导力", "q": "如果团队中有人总是拖进度，你会怎么做？", "t": "了解原因、明确期望、提供支持，必要时升级。", "qe": "Someone on the team keeps missing deadlines. What do you do?", "te": "Understand why, clarify expectations, offer support, escalate if needed."}, {"r": 3, "c": "团队与领导力", "q": "你如何在团队中建立设计的影响力？", "t": "解决真实业务问题、让设计决策透明、主动分享。", "qe": "How do you build design's influence on a team?", "te": "Solve real business problems, make design decisions transparent, share proactively."}, {"r": 3, "c": "团队与领导力", "q": "讲一次你和同事发生冲突的经历。", "t": "冲突原因、你的处理方式、结果与反思，聚焦事而非人。", "qe": "Tell me about a conflict with a colleague.", "te": "The cause, how you handled it, the outcome and what you learned. Focus on the issue, not the person."}, {"r": 3, "c": "团队与领导力", "q": "你更喜欢独立工作还是团队协作？", "t": "两者都能胜任，举例说明在不同场景的表现。", "qe": "Do you prefer working independently or on a team?", "te": "Show you can do both, with examples from different situations."}, {"r": 3, "c": "团队与领导力", "q": "如果让你搭建一个设计团队，你会怎么规划？", "t": "业务需求→能力模型→人员结构→协作机制→成长体系。", "qe": "If you were asked to build a design team, how would you plan it?", "te": "Business needs → skill model → team structure → collaboration model → growth system."}, {"r": 3, "c": "团队与领导力", "q": "如何评价一个设计师的绩效？", "t": "业务结果、专业质量、协作影响力、成长性。", "qe": "How do you evaluate a designer's performance?", "te": "Business results, craft quality, collaborative influence, growth."}, {"r": 3, "c": "团队与领导力", "q": "你如何给别人的设计提反馈？", "t": "先理解目标、具体指出问题与原因、给建议而非命令。", "qe": "How do you give feedback on someone else's design?", "te": "Understand the goal first, point to specific problems and reasons, suggest rather than dictate."}, {"r": 3, "c": "团队与领导力", "q": "你如何接受别人对你设计的批评？", "t": "区分意见与事实，追问原因，不防御。", "qe": "How do you take criticism of your design?", "te": "Separate opinion from fact, ask why, don't get defensive."}, {"r": 3, "c": "团队与领导力", "q": "你如何向不懂设计的老板汇报设计方案？", "t": "从业务问题和目标出发，少讲视觉细节，多讲预期效果与风险。", "qe": "How do you present a design to a manager who isn't a designer?", "te": "Start from the business problem and goals; talk less about visuals and more about expected impact and risks."}, {"r": 3, "c": "压力与情境题", "q": "讲一次你在巨大压力下完成任务的经历。", "t": "压力来源、你的应对策略、结果，体现韧性与方法。", "qe": "Tell me about a time you delivered under heavy pressure.", "te": "The source of pressure, your strategy, the result. Show resilience and method."}, {"r": 3, "c": "压力与情境题", "q": "如果入职后发现工作和预期不一样，你会怎么办？", "t": "主动沟通、调整心态、在现有工作中找成长点。", "qe": "If the job turns out different from what you expected, what will you do?", "te": "Communicate early, adjust your mindset, and find growth in the work you have."}, {"r": 3, "c": "压力与情境题", "q": "你犯过的最大的工作失误是什么？", "t": "真实、承担责任、补救措施、机制改进。", "qe": "What's the biggest mistake you've made at work?", "te": "Be honest, take responsibility, describe the fix and the process change."}, {"r": 3, "c": "压力与情境题", "q": "如果项目上线后数据很差，老板很不满意，你怎么办？", "t": "冷静复盘、快速定位问题、提出补救方案，主动承担。", "qe": "After launch the numbers are bad and leadership is unhappy. What do you do?", "te": "Review calmly, find the problem fast, propose a fix, and take ownership."}, {"r": 3, "c": "压力与情境题", "q": "连续加班一个月，你会有什么感受？如何调整？", "t": "坦诚表达，体现自我管理与可持续工作的意识。", "qe": "How would you feel after a month of overtime, and how would you cope?", "te": "Be candid and show you manage yourself and care about sustainable work."}, {"r": 3, "c": "压力与情境题", "q": "你如何处理工作与生活的平衡？", "t": "时间管理方法，同时表达对关键时期投入的理解。", "qe": "How do you balance work and life?", "te": "Your time management approach, plus understanding that crunch periods happen."}, {"r": 3, "c": "压力与情境题", "q": "如果你的方案被否了三次，你还会坚持吗？", "t": "反思否定原因，判断是方向问题还是表达问题，适时坚持或调整。", "qe": "Your proposal has been rejected three times. Do you keep pushing?", "te": "Reflect on why: is it the direction or the presentation? Then persist or adjust."}, {"r": 3, "c": "压力与情境题", "q": "突然被调到一个你不熟悉的业务，你会如何快速上手？", "t": "学习业务、访谈关键人、走查产品、找到快速见效的切入点。", "qe": "You're suddenly moved to an unfamiliar business. How do you ramp up fast?", "te": "Learn the business, interview key people, audit the product, find a quick win."}, {"r": 3, "c": "压力与情境题", "q": "如果你发现产品中有损害用户利益的设计，你会怎么做？", "t": "表明立场，提出替代方案，用长期风险说服决策者。", "qe": "You find a design in the product that harms users. What do you do?", "te": "Take a clear stance, offer an alternative, and persuade decision-makers with long-term risk."}, {"r": 3, "c": "压力与情境题", "q": "你的工作被别人抢功了，你会怎么处理？", "t": "冷静、沟通、让工作过程可见，关注长期而非一时。", "qe": "Someone takes credit for your work. How do you handle it?", "te": "Stay calm, talk it through, make your process visible, and think long term."}, {"r": 3, "c": "压力与情境题", "q": "面试官：我觉得你的作品集一般，你怎么看？", "t": "压力面：不慌乱，追问具体原因，补充说明亮点和思考。", "qe": "Interviewer: “I think your portfolio is average.” How do you respond?", "te": "A stress question: stay composed, ask what specifically, and highlight your strengths and thinking."}, {"r": 3, "c": "压力与情境题", "q": "给你一周时间，你能为我们的产品做什么？", "t": "提前研究，提出一两个具体可落地的改进点。", "qe": "Given one week, what could you do for our product?", "te": "Research beforehand and propose one or two specific, actionable improvements."}, {"r": 3, "c": "行业认知与视野", "q": "你最近关注的行业趋势有哪些？", "t": "AI、多模态交互、隐私、可持续设计等，谈对你工作的影响。", "qe": "Which industry trends are you following?", "te": "AI, multimodal interaction, privacy, sustainable design and so on, and how they affect your work."}, {"r": 3, "c": "行业认知与视野", "q": "AI 时代，交互设计师的核心竞争力是什么？", "t": "问题定义、判断力、系统思维、对人的理解，以及驾驭 AI 工具的能力。", "qe": "In the AI era, what is an interaction designer's core advantage?", "te": "Problem framing, judgment, systems thinking, understanding people, and skill with AI tools."}, {"r": 3, "c": "行业认知与视野", "q": "你如何看待对话式界面（CUI）替代图形界面（GUI）的说法？", "t": "各有适用场景，未来是融合；谈具体例子。", "qe": "What do you think of the claim that conversational interfaces will replace graphical ones?", "te": "Each has its place and the future is a blend; give concrete examples."}, {"r": 3, "c": "行业认知与视野", "q": "设计 AI 产品和传统产品有什么不同？", "t": "不确定性输出、信任建立、可控性、反馈与纠错、预期管理。", "qe": "How is designing AI products different from traditional products?", "te": "Uncertain outputs, building trust, user control, feedback and correction, managing expectations."}, {"r": 3, "c": "行业认知与视野", "q": "你觉得我们公司的产品体验有什么问题？", "t": "提前使用，客观指出问题并给出建议，语气建设性。", "qe": "What do you think is wrong with our product's experience?", "te": "Use it beforehand, point out issues objectively with suggestions, and keep a constructive tone."}, {"r": 3, "c": "行业认知与视野", "q": "你最欣赏的一款产品是什么？为什么？", "t": "从用户、商业、体验三个层面分析，而不只是好看。", "qe": "Which product do you admire most, and why?", "te": "Analyze it from user, business and experience angles, not just looks."}, {"r": 3, "c": "行业认知与视野", "q": "你最欣赏的设计师或设计团队是谁？", "t": "说出具体作品和你从中学到的方法。", "qe": "Which designer or design team do you admire most?", "te": "Name specific work and the methods you learned from it."}, {"r": 3, "c": "行业认知与视野", "q": "你怎么看“设计驱动”这个说法？", "t": "设计驱动不是设计说了算，而是以用户洞察驱动决策。", "qe": "What do you think “design-driven” means?", "te": "It doesn't mean design gets the final say; it means user insight drives decisions."}, {"r": 3, "c": "行业认知与视野", "q": "国内和海外产品的设计风格差异在哪里？原因是什么？", "t": "信息密度、运营属性、用户习惯与商业模式差异。", "qe": "How do Chinese and Western product design styles differ, and why?", "te": "Information density, operations-heavy patterns, user habits and business models."}, {"r": 3, "c": "行业认知与视野", "q": "隐私和个性化推荐如何平衡？", "t": "透明告知、用户可控、最小化收集、价值交换。", "qe": "How do you balance privacy and personalized recommendations?", "te": "Transparency, user control, minimal data collection, a fair value exchange."}, {"r": 3, "c": "行业认知与视野", "q": "可持续设计或包容性设计，你怎么理解？", "t": "让更多人、在更多情境下能使用，并考虑长期社会影响。", "qe": "What do sustainable or inclusive design mean to you?", "te": "Making products usable by more people in more situations, and considering long-term social impact."}, {"r": 3, "c": "行业认知与视野", "q": "空间计算（如 Vision Pro）会如何改变交互设计？", "t": "眼动+手势、空间层级、舒适度与疲劳、新的设计规范。", "qe": "How will spatial computing, like Vision Pro, change interaction design?", "te": "Eye tracking plus gestures, spatial hierarchy, comfort and fatigue, new design guidelines."}, {"r": 3, "c": "价值观与文化", "q": "你认为一个好的团队文化是什么样的？", "t": "开放、坦诚、对结果负责，举例说明你如何参与建设。", "qe": "What does a good team culture look like to you?", "te": "Open, candid, accountable for results, with an example of how you contribute."}, {"r": 3, "c": "价值观与文化", "q": "你在工作中最看重什么？", "t": "成长、影响力、团队、使命等，与公司文化呼应。", "qe": "What do you value most at work?", "te": "Growth, impact, team, mission and so on, connected to the company culture."}, {"r": 3, "c": "价值观与文化", "q": "你如何定义“做好一件事”？", "t": "目标达成、过程可复盘、对他人有帮助。", "qe": "How do you define “doing something well”?", "te": "Goals met, a process you can review, and value for others."}, {"r": 3, "c": "价值观与文化", "q": "你会如何向一个十岁的孩子解释你的工作？", "t": "考察表达能力，用简单类比讲清价值。", "qe": "How would you explain your job to a ten-year-old?", "te": "Tests how you communicate; use a simple analogy to explain the value."}, {"r": 3, "c": "价值观与文化", "q": "你认为设计师需要有“品味”吗？品味从何而来？", "t": "需要；来自大量观察、实践、反思与跨领域积累。", "qe": "Do designers need “taste”? Where does it come from?", "te": "Yes; it comes from lots of observation, practice, reflection and cross-disciplinary exposure."}, {"r": 3, "c": "价值观与文化", "q": "如果用户需求和公司利益冲突，你站在哪边？", "t": "寻找共赢，坚持不伤害用户底线，长期价值一致。", "qe": "If user needs and company interests conflict, whose side are you on?", "te": "Look for a win-win, never cross the line of harming users, and align on long-term value."}, {"r": 3, "c": "价值观与文化", "q": "你做过的最有意义的一件事是什么？", "t": "体现价值观，不局限于工作。", "qe": "What's the most meaningful thing you've done?", "te": "Show your values; it doesn't have to be about work."}, {"r": 3, "c": "价值观与文化", "q": "工作之外你有什么兴趣爱好？", "t": "真实，能体现观察力或持续性的更好。", "qe": "What are your interests outside work?", "te": "Be genuine; interests that show observation or persistence are a plus."}, {"r": 3, "c": "反问环节", "q": "你还有什么问题想问我们吗？", "t": "可问：团队目前最大的挑战、对这个岗位前半年的期待、设计在团队中的角色、评价标准。", "qe": "Do you have any questions for us?", "te": "Try: the team's biggest challenge, expectations for this role in the first six months, design's role on the team, how success is measured."}, {"r": 3, "c": "反问环节", "q": "（反问练习）如何向面试官提问团队的设计成熟度？", "t": "例如：设计师参与需求的阶段、是否有设计系统、用户研究的投入。", "qe": "(Reverse-question practice) How do you ask about the team's design maturity?", "te": "For example: at what stage designers join projects, whether there's a design system, how much they invest in research."}, {"r": 3, "c": "反问环节", "q": "（反问练习）如何得体地询问面试结果和后续流程？", "t": "例如：接下来的流程和时间节点是怎样的？", "qe": "(Reverse-question practice) How do you politely ask about results and next steps?", "te": "For example: what are the next steps and the timeline?"}, {"r": 3, "c": "反问环节", "q": "（反问练习）如何询问这个岗位的晋升与成长路径？", "t": "例如：团队中优秀设计师的成长路径是怎样的？", "qe": "(Reverse-question practice) How do you ask about promotion and growth for this role?", "te": "For example: what does the growth path look like for strong designers here?"}, {"r": 3, "c": "行为面试", "q": "讲一个你“主动承担超出职责范围的工作”的具体经历。", "t": "用 STAR：情境（Situation）、任务（Task）、行动（Action，重点讲你做了什么）、结果（Result，尽量量化），最后补一句反思。", "qe": "Tell me about a time you took on work beyond your responsibilities.", "te": "Use STAR: Situation, Task, Action (focus on what you did), Result (quantify if you can), then add one line of reflection."}, {"r": 3, "c": "行为面试", "q": "讲一个你“在信息不完整时做出决策”的具体经历。", "t": "用 STAR：情境（Situation）、任务（Task）、行动（Action，重点讲你做了什么）、结果（Result，尽量量化），最后补一句反思。", "qe": "Tell me about a time you made a decision with incomplete information.", "te": "Use STAR: Situation, Task, Action (focus on what you did), Result (quantify if you can), then add one line of reflection."}, {"r": 3, "c": "行为面试", "q": "讲一个你“说服别人改变想法”的具体经历。", "t": "用 STAR：情境（Situation）、任务（Task）、行动（Action，重点讲你做了什么）、结果（Result，尽量量化），最后补一句反思。", "qe": "Tell me about a time you changed someone's mind.", "te": "Use STAR: Situation, Task, Action (focus on what you did), Result (quantify if you can), then add one line of reflection."}, {"r": 3, "c": "行为面试", "q": "讲一个你“快速学习一项新技能”的具体经历。", "t": "用 STAR：情境（Situation）、任务（Task）、行动（Action，重点讲你做了什么）、结果（Result，尽量量化），最后补一句反思。", "qe": "Tell me about a time you learned a new skill quickly.", "te": "Use STAR: Situation, Task, Action (focus on what you did), Result (quantify if you can), then add one line of reflection."}, {"r": 3, "c": "行为面试", "q": "讲一个你“把一个复杂问题讲清楚”的具体经历。", "t": "用 STAR：情境（Situation）、任务（Task）、行动（Action，重点讲你做了什么）、结果（Result，尽量量化），最后补一句反思。", "qe": "Tell me about a time you made a complex problem easy to understand.", "te": "Use STAR: Situation, Task, Action (focus on what you did), Result (quantify if you can), then add one line of reflection."}, {"r": 3, "c": "行为面试", "q": "讲一个你“放弃一个自己很喜欢的方案”的具体经历。", "t": "用 STAR：情境（Situation）、任务（Task）、行动（Action，重点讲你做了什么）、结果（Result，尽量量化），最后补一句反思。", "qe": "Tell me about a time you gave up a solution you really liked.", "te": "Use STAR: Situation, Task, Action (focus on what you did), Result (quantify if you can), then add one line of reflection."}, {"r": 3, "c": "行为面试", "q": "讲一个你“在截止日期前发现重大问题”的具体经历。", "t": "用 STAR：情境（Situation）、任务（Task）、行动（Action，重点讲你做了什么）、结果（Result，尽量量化），最后补一句反思。", "qe": "Tell me about a time you found a major problem right before a deadline.", "te": "Use STAR: Situation, Task, Action (focus on what you did), Result (quantify if you can), then add one line of reflection."}, {"r": 3, "c": "行为面试", "q": "讲一个你“帮助团队提升效率”的具体经历。", "t": "用 STAR：情境（Situation）、任务（Task）、行动（Action，重点讲你做了什么）、结果（Result，尽量量化），最后补一句反思。", "qe": "Tell me about a time you helped your team work more efficiently.", "te": "Use STAR: Situation, Task, Action (focus on what you did), Result (quantify if you can), then add one line of reflection."}, {"r": 3, "c": "行为面试", "q": "讲一个你“处理用户的负面反馈”的具体经历。", "t": "用 STAR：情境（Situation）、任务（Task）、行动（Action，重点讲你做了什么）、结果（Result，尽量量化），最后补一句反思。", "qe": "Tell me about a time you handled negative feedback from users.", "te": "Use STAR: Situation, Task, Action (focus on what you did), Result (quantify if you can), then add one line of reflection."}, {"r": 3, "c": "行为面试", "q": "讲一个你“从失败中恢复”的具体经历。", "t": "用 STAR：情境（Situation）、任务（Task）、行动（Action，重点讲你做了什么）、结果（Result，尽量量化），最后补一句反思。", "qe": "Tell me about a time you bounced back from a failure.", "te": "Use STAR: Situation, Task, Action (focus on what you did), Result (quantify if you can), then add one line of reflection."}, {"r": 3, "c": "行为面试", "q": "讲一个你“推动跨部门合作”的具体经历。", "t": "用 STAR：情境（Situation）、任务（Task）、行动（Action，重点讲你做了什么）、结果（Result，尽量量化），最后补一句反思。", "qe": "Tell me about a time you drove a cross-department collaboration.", "te": "Use STAR: Situation, Task, Action (focus on what you did), Result (quantify if you can), then add one line of reflection."}, {"r": 3, "c": "行为面试", "q": "讲一个你“坚持自己的专业判断”的具体经历。", "t": "用 STAR：情境（Situation）、任务（Task）、行动（Action，重点讲你做了什么）、结果（Result，尽量量化），最后补一句反思。", "qe": "Tell me about a time you stood by your professional judgment.", "te": "Use STAR: Situation, Task, Action (focus on what you did), Result (quantify if you can), then add one line of reflection."}, {"r": 3, "c": "行为面试", "q": "讲一个你“处理多个优先级冲突”的具体经历。", "t": "用 STAR：情境（Situation）、任务（Task）、行动（Action，重点讲你做了什么）、结果（Result，尽量量化），最后补一句反思。", "qe": "Tell me about a time you handled competing priorities.", "te": "Use STAR: Situation, Task, Action (focus on what you did), Result (quantify if you can), then add one line of reflection."}, {"r": 3, "c": "行为面试", "q": "讲一个你“给上级提出不同意见”的具体经历。", "t": "用 STAR：情境（Situation）、任务（Task）、行动（Action，重点讲你做了什么）、结果（Result，尽量量化），最后补一句反思。", "qe": "Tell me about a time you disagreed with your manager.", "te": "Use STAR: Situation, Task, Action (focus on what you did), Result (quantify if you can), then add one line of reflection."}, {"r": 3, "c": "行为面试", "q": "讲一个你“在资源不足的情况下完成目标”的具体经历。", "t": "用 STAR：情境（Situation）、任务（Task）、行动（Action，重点讲你做了什么）、结果（Result，尽量量化），最后补一句反思。", "qe": "Tell me about a time you hit a goal with limited resources.", "te": "Use STAR: Situation, Task, Action (focus on what you did), Result (quantify if you can), then add one line of reflection."}, {"r": 3, "c": "行为面试", "q": "讲一个你“建立一项团队流程或规范”的具体经历。", "t": "用 STAR：情境（Situation）、任务（Task）、行动（Action，重点讲你做了什么）、结果（Result，尽量量化），最后补一句反思。", "qe": "Tell me about a time you set up a team process or standard.", "te": "Use STAR: Situation, Task, Action (focus on what you did), Result (quantify if you can), then add one line of reflection."}, {"r": 3, "c": "行为面试", "q": "讲一个你“赢得一个难相处同事的信任”的具体经历。", "t": "用 STAR：情境（Situation）、任务（Task）、行动（Action，重点讲你做了什么）、结果（Result，尽量量化），最后补一句反思。", "qe": "Tell me about a time you won the trust of a difficult colleague.", "te": "Use STAR: Situation, Task, Action (focus on what you did), Result (quantify if you can), then add one line of reflection."}, {"r": 3, "c": "行为面试", "q": "讲一个你“把模糊的需求变成清晰的方案”的具体经历。", "t": "用 STAR：情境（Situation）、任务（Task）、行动（Action，重点讲你做了什么）、结果（Result，尽量量化），最后补一句反思。", "qe": "Tell me about a time you turned a vague request into a clear plan.", "te": "Use STAR: Situation, Task, Action (focus on what you did), Result (quantify if you can), then add one line of reflection."}, {"r": 3, "c": "行为面试", "q": "讲一个你“对一个已上线的设计进行纠错”的具体经历。", "t": "用 STAR：情境（Situation）、任务（Task）、行动（Action，重点讲你做了什么）、结果（Result，尽量量化），最后补一句反思。", "qe": "Tell me about a time you corrected a design that had already shipped.", "te": "Use STAR: Situation, Task, Action (focus on what you did), Result (quantify if you can), then add one line of reflection."}, {"r": 3, "c": "行为面试", "q": "讲一个你“在团队中分享知识并产生影响”的具体经历。", "t": "用 STAR：情境（Situation）、任务（Task）、行动（Action，重点讲你做了什么）、结果（Result，尽量量化），最后补一句反思。", "qe": "Tell me about a time you shared knowledge with your team and made an impact.", "te": "Use STAR: Situation, Task, Action (focus on what you did), Result (quantify if you can), then add one line of reflection."}, {"r": 1, "c": "交互基础", "q": "什么是用户心流？如何在产品中营造？", "t": "目标清晰、即时反馈、难度与能力匹配、减少打断。", "qe": "What is flow, and how do you create it in a product?", "te": "Clear goals, immediate feedback, challenge matched to skill, fewer interruptions."}, {"r": 1, "c": "交互基础", "q": "什么是情感化设计？有哪三个层次？", "t": "诺曼：本能层、行为层、反思层，各举例。", "qe": "What is emotional design, and what are its three levels?", "te": "Norman's visceral, behavioral and reflective levels, with an example of each."}, {"r": 1, "c": "交互基础", "q": "设计中的“一致性”包括哪几个层面？", "t": "视觉一致、交互一致、内部一致、外部（平台）一致。", "qe": "What layers does “consistency” include in design?", "te": "Visual, interaction, internal, and external (platform) consistency."}, {"r": 1, "c": "交互基础", "q": "你如何理解“少即是多”？有没有反例？", "t": "减少认知负担，但过度简化会损失可发现性与效率。", "qe": "What does “less is more” mean to you? Are there counterexamples?", "te": "It reduces cognitive load, but oversimplifying hurts discoverability and efficiency."}, {"r": 1, "c": "交互基础", "q": "拟物化、扁平化、新拟态各有什么优缺点？", "t": "可识别性 vs 简洁 vs 对比度与可访问性问题。", "qe": "What are the pros and cons of skeuomorphism, flat design and neumorphism?", "te": "Recognizability vs simplicity vs contrast and accessibility issues."}, {"r": 1, "c": "交互基础", "q": "如何设计一个让人放心的支付体验？", "t": "安全感知、信息透明、确认机制、结果反馈与异常处理。", "qe": "How do you design a payment experience that feels safe?", "te": "Visible security, transparent information, confirmation, clear results and error handling."}, {"r": 1, "c": "交互基础", "q": "通知权限请求应该在什么时机弹出？", "t": "在用户理解价值的时刻前置说明（软请求），而非首次打开即弹。", "qe": "When should you ask for notification permission?", "te": "Explain the value first with a soft prompt at the right moment, not on first launch."}, {"r": 1, "c": "交互基础", "q": "列表页和卡片布局各适合什么内容？", "t": "列表利于扫读和对比，卡片适合图文与异构内容。", "qe": "When do lists and cards each fit best?", "te": "Lists are good for scanning and comparing; cards suit rich media and mixed content."}, {"r": 1, "c": "交互基础", "q": "如何设计一个好的设置页？", "t": "分组清晰、常用置顶、搜索、即时生效反馈、默认值合理。", "qe": "How do you design a good settings page?", "te": "Clear groups, common settings on top, search, instant feedback, sensible defaults."}, {"r": 1, "c": "交互基础", "q": "如何优化一个转化率很低的注册流程？", "t": "减少字段、第三方登录、延迟注册、价值前置、错误提示优化。", "qe": "How do you improve a sign-up flow with very low conversion?", "te": "Fewer fields, social sign-in, deferred sign-up, value first, better error messages."}, {"r": 1, "c": "交互基础", "q": "什么是 Hook 上瘾模型？你怎么看它的伦理问题？", "t": "触发、行动、多变奖励、投入；区分帮助用户养成好习惯与操控。", "qe": "What is the Hook model, and what are its ethical issues?", "te": "Trigger, action, variable reward, investment; separate helping users build good habits from manipulation."}, {"r": 1, "c": "交互基础", "q": "设计中“默认值”有多重要？", "t": "大多数用户不改默认值，默认值直接决定体验与结果。", "qe": "How important are defaults in design?", "te": "Most users never change defaults, so defaults largely decide the experience and outcome."}, {"r": 1, "c": "交互基础", "q": "如何设计一个清晰的价格展示？", "t": "主次价格、原价划线、优惠说明透明、避免误导。", "qe": "How do you design clear pricing?", "te": "Primary and secondary prices, strikethrough original price, transparent discounts, nothing misleading."}, {"r": 1, "c": "交互基础", "q": "长列表如何帮助用户快速定位内容？", "t": "搜索、筛选、排序、索引条、分组吸顶。", "qe": "How do you help users find things quickly in a long list?", "te": "Search, filters, sorting, an index bar, sticky group headers."}, {"r": 1, "c": "交互基础", "q": "什么时候用底部导航栏，什么时候用汉堡菜单？", "t": "核心入口 3-5 个且需高频切换用底部导航；次要入口收进菜单。", "qe": "When do you use a bottom tab bar versus a hamburger menu?", "te": "Use bottom tabs for 3–5 core destinations users switch between often; put secondary items in a menu."}, {"r": 1, "c": "交互基础", "q": "如何设计一个好用的筛选功能？", "t": "常用条件外露、已选状态可见、结果数量预告、一键重置。", "qe": "How do you design a useful filter feature?", "te": "Expose common filters, show what's selected, preview the result count, one-tap reset."}, {"r": 1, "c": "交互基础", "q": "Toast、Snackbar、Banner 和 Dialog 的区别是什么？", "t": "按打断程度、是否可操作、停留时长区分。", "qe": "What's the difference between a toast, a snackbar, a banner and a dialog?", "te": "They differ in how disruptive they are, whether they take actions, and how long they stay."}, {"r": 1, "c": "交互基础", "q": "如何设计倒计时类交互，避免给用户造成焦虑？", "t": "说明原因与后果、提供延长或稍后选项、避免虚假紧迫感。", "qe": "How do you design countdowns without making users anxious?", "te": "Explain why and what happens, offer to extend or come back later, avoid fake urgency."}, {"r": 1, "c": "交互基础", "q": "拖拽交互需要哪些反馈？", "t": "可拖拽暗示、拖起状态、放置区高亮、位置预览、撤销。", "qe": "What feedback does drag and drop need?", "te": "A draggable hint, a lifted state, highlighted drop zones, a position preview, undo."}, {"r": 1, "c": "交互基础", "q": "如何处理用户输入中的错误，比如手机号格式？", "t": "自动格式化、宽容输入、实时校验而非提交后报错。", "qe": "How do you handle input errors, such as a phone number format?", "te": "Auto-format, accept flexible input, validate inline instead of after submit."}, {"r": 1, "c": "交互基础", "q": "如何设计一个好的引导（新手教程）？", "t": "情境化引导优于一次性轮播，可跳过，与真实任务结合。", "qe": "How do you design good onboarding tutorials?", "te": "Contextual guidance beats a one-time carousel; make it skippable and tie it to real tasks."}, {"r": 1, "c": "交互基础", "q": "横屏和竖屏切换时，界面需要注意什么？", "t": "布局重排、保持当前上下文、控件位置合理。", "qe": "What should you watch for when switching between portrait and landscape?", "te": "Reflow the layout, keep the current context, place controls sensibly."}, {"r": 1, "c": "交互基础", "q": "如何设计内容的“返回顶部”与“记住浏览位置”？", "t": "长页面提供返回顶部，返回列表时保持滚动位置。", "qe": "How do you design “back to top” and “remember scroll position”?", "te": "Offer back to top on long pages, and keep the scroll position when returning to a list."}, {"r": 1, "c": "交互基础", "q": "你如何理解“容错设计”？", "t": "预防出错（约束、默认值）+ 出错可恢复（撤销、草稿保存）。", "qe": "What does “error-tolerant design” mean to you?", "te": "Prevent errors (constraints, defaults) + make them recoverable (undo, draft saving)."}, {"r": 1, "c": "交互基础", "q": "文字链接、文字按钮、图标按钮如何选用？", "t": "按操作重要性和空间：主操作用实体按钮，次要用文字按钮。", "qe": "How do you choose between text links, text buttons and icon buttons?", "te": "Decide by importance and space: solid buttons for primary actions, text buttons for secondary ones."}, {"r": 1, "c": "交互基础", "q": "如何设计一个让用户愿意填写的个人资料页？", "t": "说明用途、分步完善、进度激励、隐私可控。", "qe": "How do you design a profile page people are willing to fill in?", "te": "Explain what it's for, let people complete it in steps, reward progress, give privacy control."}, {"r": 1, "c": "交互基础", "q": "交互设计中的“反馈”有哪几种层次？", "t": "即时视觉反馈、状态变化反馈、结果反馈、系统级通知。", "qe": "What levels of “feedback” exist in interaction design?", "te": "Immediate visual feedback, state change feedback, result feedback, system-level notifications."}, {"r": 1, "c": "自我介绍与作品集", "q": "你的作品集里，交互设计和视觉设计各占多少比重？", "t": "说明自身定位，与岗位侧重点匹配。", "qe": "How is your portfolio split between interaction design and visual design?", "te": "Explain how you position yourself and match it to what the role emphasizes."}, {"r": 1, "c": "自我介绍与作品集", "q": "这个项目中你是如何获取需求背景的？", "t": "参与需求评审、看数据、访谈业务方，体现主动性。", "qe": "How did you learn the background of the requirements in this project?", "te": "Joining requirement reviews, reading data, interviewing stakeholders; show initiative."}, {"r": 1, "c": "自我介绍与作品集", "q": "你在作品集中用了很多流程图，能讲讲其中一个关键节点的设计吗？", "t": "挑一个有分支和异常的节点，讲清处理逻辑。", "qe": "Your portfolio has many flow diagrams. Can you walk me through one key step?", "te": "Pick a step with branches and errors and explain how you handled it."}, {"r": 1, "c": "自我介绍与作品集", "q": "你的项目中有没有被用户吐槽过的设计？", "t": "真实案例，说明你如何响应和改进。", "qe": "Have users ever complained about one of your designs?", "te": "A real example, and how you responded and improved it."}, {"r": 1, "c": "自我介绍与作品集", "q": "你在团队中通常扮演什么角色？", "t": "执行者、推动者、协调者等，用事例说明。", "qe": "What role do you usually play on a team?", "te": "Executor, driver, coordinator and so on, with examples."}, {"r": 1, "c": "自我介绍与作品集", "q": "你最近在学习什么新的设计技能？", "t": "具体技能、学习方式、是否已应用到工作中。", "qe": "What new design skill are you learning lately?", "te": "The specific skill, how you're learning it, whether you've applied it at work."}, {"r": 1, "c": "自我介绍与作品集", "q": "你平时怎么积累设计灵感？", "t": "有体系的方法：产品体验记录、案例库、跨领域观察。", "qe": "How do you collect design inspiration?", "te": "A systematic method: logging product experiences, a case library, cross-disciplinary observation."}, {"r": 1, "c": "自我介绍与作品集", "q": "你做过最复杂的一个交互流程是什么？", "t": "讲复杂度来源（角色、状态、分支）和你的梳理方法。", "qe": "What is the most complex interaction flow you've designed?", "te": "Explain where the complexity came from (roles, states, branches) and how you mapped it."}, {"r": 1, "c": "自我介绍与作品集", "q": "你如何向面试官证明作品集中的设计是你自己做的？", "t": "讲清过程细节、废弃方案与决策依据，细节越多越可信。", "qe": "How do you prove to an interviewer that the work in your portfolio is yours?", "te": "Detail the process, discarded options and reasoning; the more detail, the more credible."}, {"r": 1, "c": "自我介绍与作品集", "q": "你的作品集最想让我看到你的什么能力？", "t": "明确卖点，与岗位需求对应。", "qe": "Which of your abilities does your portfolio most want me to see?", "te": "Be clear about your selling point and match it to the role."}, {"r": 2, "c": "项目深挖", "q": "如果用一句话总结这个项目解决的问题，你会怎么说？", "t": "练习一句话提炼：为谁、在什么场景、解决什么问题、带来什么价值。", "qe": "How would you sum up the problem this project solved in one sentence?", "te": "Practice the one-liner: for whom, in what context, solving what, delivering what value."}, {"r": 2, "c": "项目深挖", "q": "这个项目里有没有你坚持下来、事后证明是对的决定？", "t": "讲坚持的依据和如何获得支持。", "qe": "Is there a decision you held firm on that later proved right?", "te": "Explain why you held firm and how you won support."}, {"r": 2, "c": "项目深挖", "q": "这个项目有没有你妥协了、事后后悔的决定？", "t": "真实反思与后续改进。", "qe": "Is there a decision you compromised on and later regretted?", "te": "Honest reflection and what you changed afterward."}, {"r": 2, "c": "项目深挖", "q": "你在项目中如何处理边界和异常情况？", "t": "梳理方法：状态矩阵、用户路径穷举、与开发对齐。", "qe": "How did you handle edge cases and errors in the project?", "te": "Your method: a state matrix, mapping every user path, aligning with engineers."}, {"r": 2, "c": "项目深挖", "q": "这个项目的设计规范是你建立的吗？", "t": "说明规范的范围、推动过程和使用情况。", "qe": "Did you create the design guidelines for this project?", "te": "Explain the scope, how you drove adoption, and how they're used."}, {"r": 2, "c": "项目深挖", "q": "项目中用户研究的结论有没有推翻你最初的假设？", "t": "体现对假设的开放态度与基于证据的调整。", "qe": "Did user research overturn any of your initial assumptions?", "te": "Show openness about assumptions and evidence-based adjustment."}, {"r": 2, "c": "项目深挖", "q": "如果给这个项目打分，满分 10 分你给几分？为什么？", "t": "客观评估，指出亮点和不足。", "qe": "Out of 10, what score would you give this project, and why?", "te": "Assess it objectively, naming highlights and shortcomings."}, {"r": 2, "c": "项目深挖", "q": "这个项目中，你如何定义“成功”？", "t": "设计目标、衡量指标与达成情况。", "qe": "How did you define “success” for this project?", "te": "Design goals, metrics, and whether you hit them."}, {"r": 2, "c": "产品思维", "q": "如果给你一个全新的产品方向，你会如何做市场和用户调研？", "t": "桌面研究、竞品、用户访谈、问卷验证、机会评估。", "qe": "Given a brand-new product direction, how would you research the market and users?", "te": "Desk research, competitors, user interviews, survey validation, opportunity assessment."}, {"r": 2, "c": "产品思维", "q": "如何判断一个功能应该做成独立 App 还是放在主 App 里？", "t": "用户重合度、使用频次、品牌战略、流量协同。", "qe": "How do you decide whether a feature should be a separate app or live in the main app?", "te": "User overlap, frequency of use, brand strategy, traffic synergy."}, {"r": 2, "c": "产品思维", "q": "免费功能和付费功能的边界怎么划？", "t": "免费保证核心价值体验，付费提供增值与效率，避免削弱基础体验。", "qe": "How do you draw the line between free and paid features?", "te": "Free keeps the core value; paid adds extra value and efficiency, without weakening the basics."}, {"r": 2, "c": "产品思维", "q": "你如何看待“用户越多，产品体验越难做”？", "t": "用户分层、个性化、渐进式复杂度。", "qe": "What do you think of “the more users, the harder the experience gets”?", "te": "User segmentation, personalization, progressive complexity."}, {"r": 2, "c": "产品思维", "q": "设计如何帮助降低客服成本？", "t": "高频问题前置解决、自助服务、清晰的状态与说明。", "qe": "How can design help reduce customer support costs?", "te": "Solve frequent issues upfront, self-service, clear status and explanations."}, {"r": 2, "c": "产品思维", "q": "如何设计一个产品的推荐理由，让用户更信任推荐？", "t": "可解释性、个性化依据、用户可反馈与调整。", "qe": "How do you design recommendation reasons that make users trust recommendations more?", "te": "Explainability, the basis for personalization, letting users give feedback and adjust."}, {"r": 2, "c": "产品思维", "q": "一个产品要国际化，设计上需要考虑什么？", "t": "文字长度、阅读方向、日期货币格式、文化与色彩含义、本地化习惯。", "qe": "What should design consider when a product goes international?", "te": "Text length, reading direction, date and currency formats, cultural and color meanings, local habits."}, {"r": 3, "c": "职业规划与动机", "q": "你觉得自己目前处在职业生涯的什么阶段？", "t": "清晰的自我定位与下一阶段目标。", "qe": "What stage of your career do you think you're in?", "te": "A clear sense of where you are and your next goal."}, {"r": 3, "c": "职业规划与动机", "q": "如果我们给你的职级比你期望的低，你会接受吗？", "t": "表达对成长和平台的重视，同时说明期望与依据。", "qe": "If we offer a level lower than you expect, would you accept?", "te": "Show that you value growth and the platform, while stating your expectation and reasoning."}, {"r": 3, "c": "职业规划与动机", "q": "你对加班怎么看？", "t": "理性表达，关注效率与阶段性投入。", "qe": "What's your view on overtime?", "te": "Be reasonable: focus on efficiency and occasional intense periods."}, {"r": 3, "c": "职业规划与动机", "q": "你在上一家公司的绩效怎么样？", "t": "如实，结合具体成果说明。", "qe": "How was your performance at your last company?", "te": "Be honest and back it up with specific results."}, {"r": 3, "c": "职业规划与动机", "q": "你理想中的上级是什么样的？", "t": "描述具体特质，避免苛刻，体现自我驱动。", "qe": "What does your ideal manager look like?", "te": "Describe specific traits, don't be demanding, and show you're self-driven."}, {"r": 3, "c": "职业规划与动机", "q": "你的家人支持你换工作吗？", "t": "简短回答，体现稳定性。", "qe": "Does your family support your job change?", "te": "Keep it short and show stability."}, {"r": 3, "c": "职业规划与动机", "q": "如果你同时拿到我们和另一家公司的 offer，你会怎么选？", "t": "说明决策维度，表达对本公司的兴趣点。", "qe": "If you got offers from us and another company, how would you choose?", "te": "Explain your decision criteria and what draws you to this company."}, {"r": 3, "c": "职业规划与动机", "q": "你过去换工作的频率是怎样的？原因是什么？", "t": "解释每次变动的逻辑，体现稳定和成长的一致性。", "qe": "How often have you changed jobs, and why?", "te": "Explain the logic of each move to show consistent stability and growth."}, {"r": 3, "c": "职业规划与动机", "q": "你能接受多久的入职等待时间？", "t": "给出具体时间，体现对现有工作的负责交接。", "qe": "How long a notice period can you accept?", "te": "Give a specific time and show you'll hand off your current work responsibly."}, {"r": 3, "c": "职业规划与动机", "q": "如果入职后让你做大量执行性工作，你会怎么想？", "t": "理解阶段需要，在执行中找到提升与影响空间。", "qe": "If the job involves a lot of execution work, how would you feel?", "te": "Understand what the stage needs, and find room for growth and impact in execution."}, {"r": 3, "c": "团队与领导力", "q": "你如何让开发同学更认同你的设计？", "t": "让开发早参与、讲清背后原因、尊重技术约束。", "qe": "How do you get engineers to buy into your designs?", "te": "Involve them early, explain the reasoning, respect technical constraints."}, {"r": 3, "c": "团队与领导力", "q": "当团队士气低落时，你会做什么？", "t": "了解原因、小胜利激励、清晰目标、真诚沟通。", "qe": "What do you do when team morale is low?", "te": "Understand why, celebrate small wins, set clear goals, communicate honestly."}, {"r": 3, "c": "团队与领导力", "q": "你如何在远程或异地团队中协作？", "t": "异步文档、清晰的交付标准、定期同步。", "qe": "How do you collaborate on remote or distributed teams?", "te": "Async docs, clear delivery standards, regular syncs."}, {"r": 3, "c": "团队与领导力", "q": "你如何培养团队的用户意识？", "t": "邀请参与访谈、分享用户录像、建立用户反馈看板。", "qe": "How do you build user awareness across the team?", "te": "Invite people to interviews, share user recordings, set up a feedback dashboard."}, {"r": 3, "c": "团队与领导力", "q": "如何让设计在需求早期就参与进来？", "t": "主动参与业务讨论，用快速原型帮助澄清需求，证明价值。", "qe": "How do you get design involved early in the requirements process?", "te": "Join business discussions, clarify requirements with quick prototypes, prove the value."}, {"r": 3, "c": "团队与领导力", "q": "你如何对待比你资历浅但很有想法的同事？", "t": "开放倾听、给予机会、共同验证。", "qe": "How do you treat a junior colleague with strong ideas?", "te": "Listen openly, give them opportunities, validate ideas together."}, {"r": 3, "c": "团队与领导力", "q": "你如何处理一个设计师同事的方案明显有问题，但他很坚持？", "t": "私下沟通、用证据和目标说话、必要时用测试验证。", "qe": "A fellow designer's proposal clearly has problems but they insist on it. What do you do?", "te": "Talk privately, use evidence and goals, test it if needed."}, {"r": 3, "c": "团队与领导力", "q": "你怎么看设计团队和业务团队的汇报关系？", "t": "集中式与嵌入式各自优劣，结合公司阶段谈看法。", "qe": "What do you think of reporting lines between design and business teams?", "te": "Weigh centralized vs embedded models and relate them to the company's stage."}, {"r": 3, "c": "压力与情境题", "q": "如果你的直属上级给你的方向明显是错的，你会怎么做？", "t": "先确认理解，提出依据和替代方案，尊重最终决策并记录风险。", "qe": "Your direct manager's direction is clearly wrong. What do you do?", "te": "Confirm you understand, present evidence and alternatives, respect the final call and document the risks."}, {"r": 3, "c": "压力与情境题", "q": "你被要求在两天内完成一个原本需要两周的项目，你会怎么办？", "t": "确认核心目标、砍范围、分阶段交付、同步风险。", "qe": "You're asked to finish a two-week project in two days. What do you do?", "te": "Confirm the core goal, cut scope, deliver in phases, flag the risks."}, {"r": 3, "c": "压力与情境题", "q": "面试官：我觉得你的经历和我们的岗位不太匹配，你怎么说服我？", "t": "找到可迁移能力，举具体例子，展示学习速度。", "qe": "Interviewer: “Your experience doesn't really match this role.” How do you convince me?", "te": "Find transferable skills, give specific examples, show how fast you learn."}, {"r": 3, "c": "压力与情境题", "q": "如果入职后业务突然被砍，你会怎么办？", "t": "保持心态、快速转向、把经验沉淀为可复用的方法。", "qe": "If the business is suddenly shut down after you join, what will you do?", "te": "Stay steady, pivot quickly, and turn the experience into reusable methods."}, {"r": 3, "c": "压力与情境题", "q": "你如何应对一个总是临时改需求的业务方？", "t": "理解原因、建立变更评估机制、提前对齐范围。", "qe": "How do you deal with stakeholders who keep changing requirements at the last minute?", "te": "Understand why, set up a change review process, align on scope early."}, {"r": 3, "c": "压力与情境题", "q": "你在工作中最受不了什么样的人？", "t": "避免攻击具体人，谈行为与你的应对方式。", "qe": "What kind of person do you find hardest to work with?", "te": "Don't attack anyone; talk about behaviors and how you respond."}, {"r": 3, "c": "压力与情境题", "q": "请用一分钟说服我录用你。", "t": "核心能力 + 与岗位的匹配 + 一个有力证据 + 你的意愿。", "qe": "Convince me to hire you in one minute.", "te": "Core strengths + fit with the role + one strong proof point + your motivation."}, {"r": 3, "c": "行业认知与视野", "q": "你怎么看待“设计师会被 AI 取代”的说法？", "t": "区分可被自动化的执行与需要判断力的工作，谈你的应对。", "qe": "What do you think of the claim that AI will replace designers?", "te": "Separate execution that can be automated from work that needs judgment, and say how you're adapting."}, {"r": 3, "c": "行业认知与视野", "q": "你最近体验过的最惊艳的 AI 产品是什么？", "t": "具体功能、体验亮点、可改进之处。", "qe": "What's the most impressive AI product you've tried recently?", "te": "The specific feature, what stood out, what could be better."}, {"r": 3, "c": "行业认知与视野", "q": "你如何看待体验设计中的“伦理”问题？", "t": "暗黑模式、成瘾设计、隐私；设计师的责任与边界。", "qe": "How do you think about ethics in experience design?", "te": "Dark patterns, addictive design, privacy; the designer's responsibility and limits."}, {"r": 3, "c": "行业认知与视野", "q": "如果让你预测下一个交互范式，你会说什么？", "t": "有依据地推测，如语音、空间计算、Agent 式交互。", "qe": "If you had to predict the next interaction paradigm, what would you say?", "te": "Speculate with evidence, such as voice, spatial computing, agent-style interaction."}, {"r": 1, "c": "设计流程与方法", "q": "你如何做启发式评估（专家走查）？", " /* ---------- 中文语音 ---------- */
const TTS = "speechSynthesis" in window && "SpeechSynthesisUtterance" in window;
const ZH_LANG=/^(zh|cmn|yue)([-_]|$)/i;
const ZH_NAME=/chinese|mandarin|cantonese|中文|普通话|普通話|國語|国语|粤|廣東|tingting|ting-ting|sin-ji|sinji|mei-jia|meijia|li-mu|limu|yu-shu|yushu|xiaoxiao|xiaoyi|yunxi|yunyang|huihui|kangkang|yaoyao|lili|shasha/i;
let voices=[], zhVoices=[], voice=null;
const isZhV=v=>ZH_LANG.test(v.lang||"")||ZH_NAME.test(v.name||"");
const isEnV=v=>/^en([-_]|$)/i.test(v.lang||"");
const isZh=v=>L==="en"?isEnV(v):isZhV(v);
function rank(v){ // 中文：优先普通话（大陆），其次台湾，再粤语；英文：优先美式，其次英式；本地语音优先
  const l=(v.lang||"").toLowerCase().replace("_","-");
  let s=0;
  if(L==="en"){ if(l==="en-us") s+=30; else if(l==="en-gb") s+=20; else s+=10; if(/samantha|aria|jenny|google us|ava|allison|daniel|serena/i.test(v.name)) s+=5; if(v.localService) s+=2; return -s; }
  if(/zh-cn|cmn-hans|zh-hans|cmn-cn/.test(l)) s+=30; else if(/zh-tw|cmn-hant|zh-hant/.test(l)) s+=20; else if(/hk|yue/.test(l)) s+=10; else s+=15;
  if(/xiaoxiao|yunxi|tingting|ting-ting|li-mu|yu-shu|google/i.test(v.name)) s+=5;
  if(v.localService) s+=2;
  return -s;
}
function loadVoices(){
  if(!TTS) return;
  voices=speechSynthesis.getVoices()||[];
  zhVoices=voices.filter(isZh).sort((a,b)=>rank(a)-rank(b));
  fillVoiceSelect(); applyVoice();
}
function fillVoiceSelect(){
  const sel=$("#sVoice"); sel.innerHTML="";
  const opt=(v,label)=>{const o=document.createElement("option"); o.value=v; o.textContent=label; return o};
  if(zhVoices.length){
    const g=document.createElement("optgroup"); g.label=tr("中文","English");
    zhVoices.forEach(v=>g.appendChild(opt(v.voiceURI,`${v.name}（${v.lang}）`))); sel.appendChild(g);
  } else sel.appendChild(opt("",tr("系统默认（中文）","System default (English)")));
  const others=voices.filter(v=>!isZh(v));
  if(others.length){const g=document.createElement("optgroup"); g.label=tr("其他语言（读不了中文）","Other languages (can't read English)"); others.forEach(v=>g.appendChild(opt(v.voiceURI,`${v.name}（${v.lang}）`))); sel.appendChild(g)}
}
function applyVoice(){
  const saved=S["voice_"+L]||(L==="zh"?S.voice:"");
  voice = (saved && voices.find(v=>v.voiceURI===saved)) || zhVoices[0] || null;
  // 已保存的是非中文声音时，自动换回中文
  if(voice && !isZh(voice) && zhVoices.length){voice=zhVoices[0]}
  const sel=$("#sVoice"); sel.value=voice?voice.voiceURI:"";
  const info=$("#voiceInfo"), w=$("#voiceWarn");
  if(!TTS){info.textContent=tr("当前环境不支持朗读","Speech isn't supported here"); showWarn(true); return}
  if(zhVoices.length){info.textContent=tr(`已找到 ${zhVoices.length} 个中文声音`,`${zhVoices.length} English voices found`); w.hidden=true}
  else if(voices.length){info.textContent=tr("设备上没有中文语音包","No English voice on this device"); showWarn(false)}
  else {info.textContent=tr("将使用系统默认中文语音","Using the system default English voice"); w.hidden=true}
}
function showWarn(noTTS){
  const w=$("#voiceWarn"); w.hidden=false;
  if(L==="en"){ w.innerHTML = ms("warning") + (noTTS
    ? `<div><b>Speech isn't supported here</b><p>Open this page in Safari or Chrome on your phone to hear questions read aloud.</p></div>`
    : `<div><b>No English voice found, so another voice will be used</b><p>Install an English voice, then come back and refresh:</p><ol><li>iPhone: Settings → Accessibility → Spoken Content → Voices → English</li><li>Android: Settings → Text-to-speech → Speech Services by Google → Install voice data → English</li><li>Chrome on desktop: includes Google US English; pick it above</li></ol></div>`); return; }
  w.innerHTML = ms("warning") + (noTTS
    ? `<div><b>当前环境不支持语音朗读</b><p>用手机自带的 Safari 或 Chrome 打开这个页面就能朗读。</p></div>`
    : `<div><b>设备上没有中文语音，所以会用英文声音读</b><p>安装中文语音后回到这里刷新页面：</p><ol><li>iPhone：设置 → 辅助功能 → 朗读内容 → 声音 → 中文 → 下载“婷婷”或“李慕”</li><li>安卓：设置 → 文字转语音 → Google 语音服务 → 安装语音数据 → 中文（普通话）</li><li>电脑 Chrome：自带“Google 普通话”，直接在上方选择即可</li></ol></div>`);
}
if(TTS){loadVoices(); speechSynthesis.addEventListener?speechSynthesis.addEventListener("voiceschanged",loadVoices):speechSynthesis.onvoiceschanged=loadVoices; setTimeout(loadVoices,800); setTimeout(loadVoices,2500)}
let speakToken=0;
function speak(text,onend){
  if(!TTS){onend&&onend();return}
  if(!voices.length) loadVoices();
  speechSynthesis.cancel();
  const tok=++speakToken;
  const u=new SpeechSynthesisUtterance(text);
  const dl=L==="en"?"en-US":"zh-CN";
  if(voice){u.voice=voice; u.lang=voice.lang||dl} else u.lang=dl;
  u.rate=S.rate; u.pitch=1;
  u.onend=()=>{if(tok===speakToken) onend&&onend()};
  u.onerror=()=>{if(tok===speakToken) onend&&onend()};
  try{speechSynthesis.resume()}catch(e){}
  speechSynthesis.speak(u);
}
function stopSpeak(){speakToken++; if(TTS) speechSynthesis.cancel()}

let items=[], mode="", round=0, filter="全部", cur=-1, io=null, tick=null, startAt=0, nextAt=0;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function start(m,r){mode=m; round=r||0; filter="全部"; $("#home").hidden=true; $("#play").hidden=false; build(true)}
function pool(){
  if(mode==="fav") return QS.filter(q=>favs.has(q.id));
  let p=QS.filter(q=>q.r==round);
  if(filter!=="全部") p=p.filter(q=>q.c===filter);
  return S.shuf?shuffle(p):p;
}
function buildFlow(){
  const out=[];
  [1,2,3].forEach(r=>{
    const all=QS.filter(q=>q.r==r);
    const cats=[...new Set(all.map(q=>q.c))].filter(c=>c!=="反问环节"), byC=cats.map(c=>shuffle(all.filter(q=>q.c===c)));
    const pick=[]; let k=0;
    if(r===1) pick.push(all.find(q=>q.q.startsWith("请用 2 分钟")));
    const need=FLOW[r]-(r===3?1:0);
    while(pick.length<need){const q=byC[k++%byC.length].shift(); if(q&&!pick.includes(q)) pick.push(q)}
    if(r===3) pick.push(all.find(q=>q.q.startsWith("你还有什么问题")));
    out.push({stage:r}); pick.forEach(q=>out.push(q));
  });
  out.push({stage:"end"});
  return out;
}
function build(first){
  stopSpeak(); clearInterval(tick); cur=-1;
  items = mode==="flow"?buildFlow():pool();
  renderFeed();
  if(first&&items.length) activate(0,S.auto);
}
function renderFeed(keep){
  const R0=round?RL(round):null;
  const titles={round:R0?`${R0.name} · ${R0.sub}`:"",flow:tr("完整面试流程","Full interview"),fav:tr("我的收藏","Saved")};
  $("#pTitle").textContent=titles[mode]||"";
  $("#reshuf").hidden = mode==="fav";
  renderChips();
  const feed=$("#feed"); feed.innerHTML=""; feed.scrollTop=0;
  if(!items.length){feed.innerHTML=`<div class="empty">${ms(mode==="fav"?"bookmark":"inbox")}<span>${mode==="fav"?tr("还没有收藏的题目。练习时点「收藏」即可加入这里。","Nothing saved yet. Tap Save while practicing to add questions here."):tr("这个分类下暂无题目。","No questions in this category.")}</span></div>`;updCount();return}
  let qn=0; const total=items.filter(x=>!x.stage).length;
  items.forEach((it,i)=>{
    const el=document.createElement("section"); el.className="card"; el.dataset.i=i;
    if(it.stage){el.classList.add("stage"); el.innerHTML=stageHTML(it.stage); setRound(el,it.stage==="end"?0:it.stage)}
    else {qn++; el.innerHTML=cardHTML(it,qn,total); setRound(el,it.r)}

}
function setRound(el,r){

function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
/* 把参考思路解析成可视结构：流程 / STAR / 要点 / 核心观点 */
function keyHTML(raw){
  let s=raw.trim().replace(/[。.]$/,""), lead="", body="", kind="";
  const tidy=x=>x.trim().replace(/^[，,；;。]+|[，,；;。.]+$/g,"").replace(/^(and|or) /i,"");
  if(L==="en"){
    if(/STAR/.test(s)) return `<div class="core">${esc(raw)}</div>`;
    const m=s.match(/^([^:.,]{2,30}):\s(.+)$/); if(m && !/^for example/i.test(m[1])){lead=m[1]; s=m[2]}
    const cap=x=>x.charAt(0).toUpperCase()+x.slice(1);
    if(s.includes("→")){ const steps=s.split("→").map(tidy).filter(Boolean).map(cap); body=`<ol class="flow">${steps.map((x,i)=>`<li><span class="n">${i+1}</span><span>${esc(x)}</span></li>`).join("")}</ol>`; }
    else {
      const parts=s.split(/;\s*/).map(tidy).filter(Boolean); const main=parts[0]||s, rest=parts.slice(1);
      const items=main.split(/,\s+|\s\/\s/).map(tidy).filter(Boolean).map(cap);
      if(items.length>=3 && items.every(x=>x.length<=42)) body=`<div class="pts">${items.map((x,i)=>`<span><i>${String(i+1).padStart(2,"0")}</i>${esc(x)}</span>`).join("")}</div>`;
      else body=`<div class="core">${esc(main)}</div>`;
      if(rest.length) body+=`<p class="note2">${esc(rest.join("; "))}</p>`;
    }
    return `${lead?`<p class="lead">${esc(lead)}</p>`:""}${body}`;
  }
  if(/STAR/.test(s)){
    const tail=(s.split(/[，。]最后/)[1]||"").trim();
    kind="STAR 法";
    body=`<div class="star"><div><b>S</b><span>情境</span></div><div><b>T</b><span>任务</span></div><div class="hot"><b>A</b><span>行动</span></div><div><b>R</b><span>结果</span></div></div><p class="note2">行动部分讲清「你」做了什么，结果尽量量化${tail?"，"+esc(tidy(tail.replace(/^补一句/,"再补一句"))):""}。</p>`;
  } else {
    const m=s.match(/^([^：:，。]{2,14})[：:](.+)$/);
    if(m && !/例如/.test(m[1])){lead=m[1]; s=m[2]}
    if(s.includes("→")){
      const steps=s.split("→").map(tidy).filter(Boolean);
      kind=`流程 · ${steps.length} 步`;
      body=`<ol class="flow">${steps.map((x,i)=>`<li><span class="n">${i+1}</span><span>${esc(x)}</span></li>`).join("")}</ol>`;
    } else {
      // 先按分号拆主次，再按顿号 / 斜杠拆要点
      const parts=s.split(/[；;]/).map(tidy).filter(Boolean);
      const main=parts[0], rest=parts.slice(1);
      let items=main.split(/[、\/]/).map(tidy).filter(Boolean);
      if(items.length<3 && /，/.test(main) && main.split("，").length>=3) items=main.split("，").map(tidy).filter(Boolean);
      if(items.length>=3 && items.every(x=>x.length<=22)){
        kind=`要点 · ${items.length} 个`;
        body=`<div class="pts">${items.map((x,i)=>`<span><i>${String(i+1).padStart(2,"0")}</i>${esc(x)}</span>`).join("")}</div>`;
      } else {
        kind="核心观点";
        body=`<div class="core">${esc(main)}</div>`;
      }
      if(rest.length) body+=`<p class="note2">${esc(rest.join("；"))}</p>`;
    }
  }
  return `${lead?`<p class="lead">${esc(lead)}</p>`:""}${body}`;
}
